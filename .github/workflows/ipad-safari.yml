name: Playtest the dojo in iPad Safari
on:
  push:
    branches: [codex/ipad-safari-playtest]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    name: iPad Safari (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(contains(github.event.head_commit.message, '[ipad18]')
              && '[{"mode":"normal-tab","host":"macos-15"}]'
              || '[{"mode":"normal-tab","host":"macos-15"},{"mode":"normal-tab-latest","host":"macos-26"},{"mode":"webdriver","host":"macos-26"}]') }}
    runs-on: ${{ matrix.host }}
    timeout-minutes: 28
    env:
      DOJO_URL: https://bumnumber1.github.io/fionas-japanese-flashcards/taekwondo.html
      SAFARIDRIVER_URL: http://127.0.0.1:4444
      HOMEBREW_NO_AUTO_UPDATE: '1'
      IPAD_TEST_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 26 on the macOS 15 host
        if: matrix.host == 'macos-15'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Prepare Japanese speech and a simulator audio input
        continue-on-error: true
        run: |
          brew install espeak-ng switchaudio-osx
          brew install --cask blackhole-2ch
          if ! SwitchAudioSource -a -t input | grep -Fxq 'BlackHole 2ch'; then
            sudo killall coreaudiod || true
            sleep 4
          fi
          SwitchAudioSource -t input -s 'BlackHole 2ch'
          SwitchAudioSource -t output -s 'BlackHole 2ch'
      - name: Prepare simulator input controls
        continue-on-error: true
        run: |
          brew tap meta/fb
          brew trust meta/fb
          brew install meta/fb/idb
      - name: Boot an iPad
        shell: bash
        run: |
          set -eu
          xcodebuild -version
          mkdir -p artifacts/ipad-safari
          python3 - <<'PY'
          import json, os, subprocess
          sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).strip()
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          candidates = []
          for runtime, items in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(map(int, runtime.split(".iOS-")[1].split("-")))
              if os.environ["IPAD_TEST_MODE"] == "normal-tab" and version[0] != 18:
                  continue
              if version[:2] > tuple(map(int, sdk.split(".")[:2])):
                  continue
              for device in items:
                  if device["name"].startswith("iPad"):
                      candidates.append((version, device["name"] == "iPad (A16)", device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No supported iPad Simulator runtime installed")
          version, _, name, udid = max(candidates)
          info = {"model": name, "runtime": ".".join(map(str, version)), "udid": udid}
          print(info, flush=True)
          with open("artifacts/ipad-safari/device.json", "w") as f:
              json.dump(info, f)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              print("IPAD_UDID=" + udid, file=f)
          PY
          udid=$(python3 -c 'import json;print(json.load(open("artifacts/ipad-safari/device.json"))["udid"])')
          xcrun simctl bootstatus "$udid" -b
          open -g -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$udid"
      - name: Exercise the reading controls
        if: matrix.mode == 'webdriver'
        shell: bash
        run: |
          set -eu
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --port 4444 > artifacts/ipad-safari/safaridriver.log 2>&1 &
          driver=$!
          trap 'kill "$driver" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS "$SAFARIDRIVER_URL/status" > /dev/null; then break; fi
            sleep 1
          done
          python3 -u tests/ipad_safari_playtest.py
      - name: Exercise an ordinary Mobile Safari tab with native input
        if: startsWith(matrix.mode, 'normal-tab')
        run: |
          runner_python=python3
          if python3 -m venv "$RUNNER_TEMP/dojo-ipad-tools" &&
             "$RUNNER_TEMP/dojo-ipad-tools/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: pillow; then
            runner_python="$RUNNER_TEMP/dojo-ipad-tools/bin/python"
          fi
          if [ "$IPAD_TEST_MODE" = normal-tab-latest ]; then
            export IPAD_CONSENT_DELAY=0
            for service in microphone speech-recognition; do
              if xcrun simctl privacy "$IPAD_UDID" grant "$service" com.apple.mobilesafari; then
                echo "Simulator pre-granted $service to Safari"
              else
                echo "Simulator must show its own $service sheet"
              fi
            done
          fi
          "$runner_python" -u tests/ipad_normal_tab.py
      - name: Save simulator screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-safari-${{ matrix.mode }}
          path: artifacts/ipad-safari/
          retention-days: 7
