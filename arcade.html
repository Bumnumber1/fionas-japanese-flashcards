<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fiona's Arcade">
    <title>Fiona's Game Arcade</title>
    <style>
        @import url('fonts/fonts.css');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Nunito', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 30%, #e0f7fa 60%, #fff3e0 100%);
            min-height: 100vh; padding: 16px; background-attachment: fixed; color: #37474f;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        /* ---------- header ---------- */
        .header {
            text-align: center; margin-bottom: 18px; padding: 22px 16px;
            background: rgba(255,255,255,0.72); backdrop-filter: blur(10px);
            border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 2px solid rgba(255,255,255,0.5);
        }
        .header h1 {
            font-size: 1.9em; font-weight: 800;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #3f51b5, #00bcd4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header .jp-sub { color: #ab47bc; font-weight: 800; margin-top: 2px; font-family: 'Noto Sans JP', sans-serif; }
        .header .totals { margin-top: 6px; color: #78909c; font-weight: 700; }
        .nav-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
        .nav-btn {
            border: none; border-radius: 18px; padding: 9px 16px; font-family: inherit; font-weight: 800;
            font-size: 0.92em; cursor: pointer; color: #fff; text-decoration: none; display: inline-block;
            background: linear-gradient(135deg, #7986cb, #5c6bc0); box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }
        .nav-btn.pink { background: linear-gradient(135deg, #f06292, #ec407a); }
        .nav-btn.teal { background: linear-gradient(135deg, #4dd0e1, #26c6da); }
        .nav-btn:active { transform: scale(0.96); }

        /* ---------- panels ---------- */
        .panel {
            background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); border-radius: 22px;
            padding: 18px; margin-bottom: 16px; border: 2px solid rgba(255,255,255,0.6);
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .section-title { font-size: 1.15em; color: #5e35b1; font-weight: 800; margin-bottom: 10px; }
        .section-title .st-jp { color: #b39ddb; font-size: 0.85em; margin-left: 6px; }

        /* ---------- level picker ---------- */
        .lvl-chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .lvl-chip {
            border: 2px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.6);
            border-radius: 16px; padding: 8px 14px; font-family: inherit; font-weight: 800; cursor: pointer;
            color: #607d8b; font-size: 0.95em;
        }
        .lvl-chip.active { background: linear-gradient(135deg, #ba68c8, #9575cd); color: #fff; border-color: transparent; }
        .lvl-hint { text-align: center; color: #90a4ae; font-weight: 700; font-size: 0.85em; margin-top: 8px; }

        /* ---------- category picker ---------- */
        .cat-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .allwords-chip {
            border: none; border-radius: 16px; padding: 8px 14px; font-family: inherit; font-weight: 800;
            cursor: pointer; color: #fff; background: linear-gradient(135deg, #4dd0e1, #26c6da); font-size: 0.9em;
        }
        .allwords-chip:active { transform: scale(0.96); }
        .pool-info { color: #78909c; font-weight: 800; font-size: 0.9em; }
        .mode-chips { display: flex; gap: 10px; flex-wrap: wrap; }
        .mode-chip {
            flex: 1 1 140px; padding: 12px 16px; border-radius: 16px; cursor: pointer;
            border: 3px solid #e1bee7; background: #fff; color: #6a1b9a;
            font-family: inherit; font-weight: 800; font-size: 1em;
        }
        .mode-chip.active { background: linear-gradient(135deg, #ce93d8, #b39ddb); color: #fff; border-color: #9575cd; }
        .lesson-note {
            background: #fff8e1; border: 2px dashed #ffe082; border-radius: 12px;
            padding: 9px 12px; margin: 8px 0 4px; color: #ef6c00; font-weight: 700; font-size: 0.88em;
        }
        .yr-block { margin-top: 12px; }
        .yr-block h4 { color: #6a1b9a; font-size: 0.95em; margin-bottom: 6px; }
        .wk-chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .wk-chip {
            padding: 7px 11px; border-radius: 13px; cursor: pointer; font-family: inherit;
            border: 2px solid #b3e5fc; background: #fff; color: #0277bd;
            font-weight: 800; font-size: 0.82em;
        }
        .wk-chip.on { background: linear-gradient(135deg, #4fc3f7, #29b6f6); color: #fff; border-color: #039be5; }
        .wk-chip.locked { opacity: 0.4; cursor: not-allowed; border-style: dashed; }
        .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .cat-card {
            position: relative; background: #fff; border: 2px solid #eceff1; border-radius: 16px;
            padding: 10px 8px; cursor: pointer; font-family: inherit; text-align: center; transition: transform 0.15s;
        }
        .cat-card:active { transform: scale(0.96); }
        .cat-card .c-icon { font-size: 1.7em; display: block; }
        .cat-card .c-name { font-weight: 800; color: #37474f; font-size: 0.88em; display: block; }
        .cat-card .c-count { color: #b0bec5; font-weight: 800; font-size: 0.72em; display: block; margin-top: 2px; }
        .cat-card.on { border-color: #26a69a; background: linear-gradient(160deg, #e0f2f1, #fff); }
        .cat-card.on::after { content: '✔'; position: absolute; top: 6px; right: 8px; color: #26a69a; font-weight: 800; }
        .cat-card.on .c-count { color: #26a69a; }
        .cat-card.empty { opacity: 0.55; }

        /* ---------- game grid ---------- */
        .act-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
        .act-card {
            background: #fff; border-radius: 16px; padding: 14px 10px; text-align: center; cursor: pointer;
            border: 2px solid #e1f5fe; transition: transform 0.15s;
        }
        .act-card:hover { transform: translateY(-3px); }
        .act-card .a-icon { font-size: 2em; }
        .act-card .a-name { font-weight: 800; color: #0277bd; font-size: 0.92em; }
        .act-card .a-jp { color: #90a4ae; font-size: 0.75em; font-weight: 700; }
        .act-card .a-stars { min-height: 1.2em; font-size: 0.85em; margin-top: 3px; }
        .game-card.locked { opacity: 0.6; background: #f5f5f5; border-color: #eceff1; cursor: default; }
        .game-card.locked:hover { transform: none; }
        .lock-note { color: #ef9a9a; font-weight: 800; font-size: 0.9em; }
        .game-note { text-align: center; color: #78909c; font-weight: 800; margin-bottom: 10px; min-height: 0; }

        /* ---------- cute mascot kit ---------- */
        .mascot-row { display: flex; align-items: flex-end; gap: 10px; justify-content: center; margin: 10px 0 2px; }
        .mascot {
            font-size: 2.6em; display: inline-block; cursor: pointer;
            animation: mascotBob 2.6s ease-in-out infinite; transform-origin: 50% 90%;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
        }
        .mascot.small { font-size: 1.7em; }
        .mascot.wiggle { animation: mascotWiggle 0.5s ease-in-out; }
        @keyframes mascotBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
        @keyframes mascotWiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
        .mascot-bubble {
            position: relative; background: #fff; border: 2px solid #f8bbd0; border-radius: 16px;
            padding: 8px 14px; font-weight: 800; color: #ad1457; font-size: 0.92em;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06); max-width: 340px; text-align: left;
        }
        .mascot-bubble::before { content: ''; position: absolute; left: -16px; bottom: 12px; border: 8px solid transparent; border-right-color: #f8bbd0; }
        .mascot-bubble::after  { content: ''; position: absolute; left: -12px; bottom: 13px; border: 7px solid transparent; border-right-color: #fff; }
        .mascot-bubble .mb-jp { color: #6a1b9a; display: block; font-family: 'Noto Sans JP', sans-serif; }
        .mascot-bubble .mb-en { color: #ad1457; font-size: 0.85em; font-weight: 700; }
        /* Mochi's 3-star cameo on game finish screens */
        .finish-mochi { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font-weight: 800; color: #ad1457; font-family: 'Noto Sans JP', sans-serif; }

        /* ---------- activity modal ---------- */
        .modal-back {
            display: none; position: fixed; inset: 0; background: rgba(38,50,56,0.55); z-index: 50;
            padding: 14px; overflow-y: auto;
        }
        .modal-back.open { display: flex; align-items: flex-start; justify-content: center; }
        .modal {
            background: #fdfdfd; border-radius: 22px; max-width: 560px; width: 100%; margin: 3vh auto;
            padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .modal-head .m-title { font-weight: 800; color: #37474f; font-size: 1.1em; }
        .modal-close { border: none; background: #eceff1; border-radius: 50%; width: 34px; height: 34px; font-size: 1em; cursor: pointer; font-weight: 800; color: #607d8b; }

        @media (max-width: 560px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
    <link rel="stylesheet" href="activity-styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎮 Fiona's Game Arcade</h1>
        <div class="jp-sub">ゲームセンター</div>
        <div class="totals" id="totals"></div>
        <div class="mascot-row">
            <span class="mascot" id="tako">🐙</span>
            <div class="mascot-bubble"><span class="mb-jp" id="takoJp"></span><span class="mb-en" id="takoEn"></span></div>
        </div>
        <div class="nav-row">
            <a class="nav-btn" href="index.html">🏠 Flashcards</a>
            <a class="nav-btn pink" href="workbook.html">🗺️ 5-Year Journey</a>
        </div>
    </div>

    <div class="panel">
        <div class="section-title">🎯 Where should the words come from? <span class="st-jp">どこから？</span></div>
        <div class="mode-chips" id="modeChips">
            <button class="mode-chip" data-mode="topic">🧺 By topic</button>
            <button class="mode-chip" data-mode="lesson">📚 By lesson</button>
        </div>
        <div class="lvl-hint" id="modeHint"></div>
    </div>

    <div id="topicMode">
        <div class="panel">
            <div class="section-title">🚀 Choose your level <span class="st-jp">レベル</span></div>
            <div class="lvl-chips" id="lvlChips"></div>
            <div class="lvl-hint" id="lvlHint"></div>
        </div>

        <div class="panel">
            <div class="section-title">🧺 Pick your word baskets <span class="st-jp">ことばえらび</span></div>
            <div class="cat-tools">
                <button class="allwords-chip" id="allWords">✨ All words</button>
                <span class="pool-info" id="poolInfo"></span>
            </div>
            <div class="cat-grid" id="catGrid"></div>
        </div>
    </div>

    <div id="lessonMode">
        <div class="panel">
            <div class="section-title">📚 Pick your lessons <span class="st-jp">レッスンえらび</span></div>
            <div class="cat-tools">
                <button class="allwords-chip" id="allLessons">✨ All my lessons</button>
                <button class="allwords-chip" id="lastLessons">🕒 Last 5</button>
                <span class="pool-info" id="lessonPoolInfo"></span>
            </div>
            <div class="lesson-note" id="lessonNote"></div>
            <div id="lessonYears"></div>
        </div>
    </div>

    <div class="panel">
        <div class="section-title">🕹️ Pick a game <span class="st-jp">ゲームをえらぼう</span></div>
        <div class="game-note" id="gameNote"></div>
        <div class="act-cards" id="gameGrid"></div>
    </div>
</div>

<div class="modal-back" id="modalBack">
    <div class="modal">
        <div class="modal-head">
            <span class="m-title" id="modalTitle"></span>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="act-host" id="actHost"></div>
    </div>
</div>

<script src="kanjivg_data.js"></script>
<script src="wordcats.js"></script>
<script src="curriculum.js"></script>
<script src="curriculum_y1.js"></script>
<script src="curriculum_y2.js"></script>
<script src="curriculum_y3.js"></script>
<script src="curriculum_y4.js"></script>
<script src="curriculum_y5.js"></script>
<script src="activities.js"></script>
<script>
(() => {
    const $ = id => document.getElementById(id);
    let activeRun = null;
    let modalOpenedAt = 0;

    /* ===== arcade-core-start =====
       Pure data helpers (no DOM / localStorage) so the node harness in the
       scratchpad can load this exact block and audit category coverage. */
    const LEVELS = [
        { label: 'Year 1', years: 1 },
        { label: 'Years 1-2', years: 2 },
        { label: 'Years 1-3', years: 3 },
        { label: 'Years 1-4', years: 4 },
        { label: 'All 5 Years', years: 5 },
    ];

    // The meaning taxonomy now lives in wordcats.js so the flashcard page can
    // share it - one source of truth for what a word is about.
    const CATS = WordCats.CATS, catMatch = WordCats.catMatch, catWords = WordCats.catWords;

    function levelWeeks(li) {
        const out = [];
        for (let y = 1; y <= LEVELS[li].years; y++) {
            const meta = window.CURRICULUM[y];
            if (meta && meta.weeks) out.push.apply(out, meta.weeks);
        }
        return out;
    }
    function levelVocab(li) {
        const seen = new Set(), out = [];
        levelWeeks(li).forEach(wk => (wk.vocab || []).forEach(v => {
            if (v && v.jp && v.en && !seen.has(v.jp)) { seen.add(v.jp); out.push(v); }
        }));
        return out;
    }
    function levelExamples(li) {
        let out = [];
        levelWeeks(li).forEach(wk => {
            if (wk.grammar && wk.grammar.examples) out = out.concat(wk.grammar.examples);
            if (wk.phrases) out = out.concat(wk.phrases);
        });
        // keep game setup snappy at big levels: sample down to ~400 sentences
        if (out.length > 400) {
            const a = out.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const t = a[i]; a[i] = a[j]; a[j] = t;
            }
            out = a.slice(0, 400);
        }
        return out;
    }
    function levelKanji(li) {
        const seen = new Set(), out = [];
        levelWeeks(li).forEach(wk => (wk.kanji || []).forEach(k => {
            if (k && k.char && !seen.has(k.char)) { seen.add(k.char); out.push(k); }
        }));
        return out;
    }
    function poolFor(vocab, keys) {
        return vocab.filter(v => CATS.some(c => keys.indexOf(c.key) >= 0 && catMatch(c, v)));
    }

    const GAME_KEYS = ['memory', 'listen', 'quiz', 'karuta', 'bingo', 'whack', 'shiritori', 'oddone',
                       'kanabuild', 'sort', 'blank', 'scramble', 'speak', 'shop', 'counters', 'trace',
                       'kanjimatch', 'bossquiz'];
    /* ===== arcade-core-end ===== */

    // One shared answer to "can this game run on this material?" (activities.js),
    // so the arcade and the weekly lessons never disagree about what is playable.
    function gameOk(key, sel) {
        return Activities.canRun(key, {
            pool: sel.pool, examples: sel.examples, kanji: sel.kanji,
            chars: sel.writingChars || [], story: sel.story || null,
        });
    }

    // ---------- state ----------
    function loadLevel() {
        let v = NaN;
        try { v = parseInt(localStorage.getItem('arcade-level'), 10); } catch (e) {}
        return v >= 0 && v < LEVELS.length ? v : 0;
    }
    function loadCats() {
        let keys = null;
        try { keys = JSON.parse(localStorage.getItem('arcade-cats')); } catch (e) {}
        if (Array.isArray(keys)) keys = keys.filter(k => CATS.some(c => c.key === k));
        return keys && keys.length ? keys : CATS.map(c => c.key);
    }
    // ---------- lesson-mode state ----------
    // "By lesson" builds the pool out of weeks Fiona has actually finished, so a
    // game here can only ever use material she has already been taught.
    function loadMode() {
        let v = null;
        try { v = localStorage.getItem('arcade-mode'); } catch (e) {}
        return v === 'lesson' ? 'lesson' : 'topic';
    }
    function loadWeeks() {
        let v = null;
        try { v = JSON.parse(localStorage.getItem('arcade-weeks')); } catch (e) {}
        return Array.isArray(v) ? v.filter(k => /^\d+:\d+$/.test(k)) : [];
    }
    function saveMode() { try { localStorage.setItem('arcade-mode', mode); } catch (e) {} }
    function saveWeeks() { try { localStorage.setItem('arcade-weeks', JSON.stringify(selWeeks)); } catch (e) {} }

    let mode = loadMode();
    let selWeeks = loadWeeks();
    let level = loadLevel();
    let selCats = loadCats();
    let LV = null;
    function rebuildLevel() {
        LV = { vocab: levelVocab(level), examples: levelExamples(level), kanji: levelKanji(level) };
    }
    function saveLevel() { try { localStorage.setItem('arcade-level', String(level)); } catch (e) {} }
    function saveCats() { try { localStorage.setItem('arcade-cats', JSON.stringify(selCats)); } catch (e) {} }

    function passedList() { return Journey.passedWeeks(5, 52); }
    // Drop any saved pick that is no longer unlocked (progress can be reset).
    function prunedWeeks() {
        const ok = new Set(passedList().map(p => p.year + ':' + p.week));
        return selWeeks.filter(k => ok.has(k));
    }
    function lessonSelection() {
        const keys = prunedWeeks();
        const m = Journey.mergeMaterial(keys.map(k => {
            const [y, w] = k.split(':').map(Number);
            return Journey.weekMaterial(Journey.getWeek(y, w));
        }));
        return { pool: m.pool, examples: m.examples, kanji: m.kanji, writingChars: m.chars, story: m.story };
    }
    function selection() {
        const sel = mode === 'lesson' ? lessonSelection()
            : { pool: poolFor(LV.vocab, selCats), examples: LV.examples, kanji: LV.kanji };
        if (!sel.writingChars || !sel.writingChars.length) sel.writingChars = writingChars(sel.pool);
        return sel;
    }

    // ---------- best-star records (per game, per level) ----------
    function bestFor(key) {
        let v = 0;
        try { v = parseInt(localStorage.getItem('arcade-best:' + key + ':' + level), 10); } catch (e) {}
        return v >= 1 ? Math.min(3, v) : 0;
    }
    function recordBest(key, stars) {
        try {
            if (stars > bestFor(key)) localStorage.setItem('arcade-best:' + key + ':' + level, String(stars));
        } catch (e) {}
    }

    // ---------- rendering ----------
    function renderTotals() {
        const total = GAME_KEYS.reduce((a, k) => a + bestFor(k), 0);
        $('totals').innerHTML = `⭐ ${total} arcade star${total === 1 ? '' : 's'} · <b>${escHtml(LEVELS[level].label)}</b>`;
    }
    function renderLevels() {
        $('lvlChips').innerHTML = LEVELS.map((l, i) =>
            `<button class="lvl-chip${i === level ? ' active' : ''}" data-lv="${i}">${escHtml(l.label)}</button>`).join('');
        $('lvlChips').querySelectorAll('.lvl-chip').forEach(b => b.onclick = () => {
            if (+b.dataset.lv === level) return;
            level = +b.dataset.lv; saveLevel(); rebuildLevel(); Sfx.pop();
            renderAll();
        });
        $('lvlHint').textContent = `Every word, sentence and kanji from ${LEVELS[level].label === 'Year 1' ? 'Year 1' : LEVELS[level].label.toLowerCase()} of the journey — ${LV.vocab.length} words, ${LV.kanji.length} kanji!`;
    }
    function renderCats() {
        $('catGrid').innerHTML = CATS.map(c => {
            const n = catWords(LV.vocab, c).length;
            return `<button class="cat-card${selCats.includes(c.key) ? ' on' : ''}${n ? '' : ' empty'}" data-cat="${c.key}">
                <span class="c-icon">${c.icon}</span>
                <span class="c-name">${escHtml(c.name)}</span>
                <span class="c-count">${n} word${n === 1 ? '' : 's'}</span>
            </button>`;
        }).join('');
        $('catGrid').querySelectorAll('.cat-card').forEach(b => b.onclick = () => {
            const k = b.dataset.cat;
            if (selCats.includes(k)) {
                if (selCats.length === 1) { // always keep one basket picked
                    b.classList.add('shake'); Sfx.wrong();
                    setTimeout(() => b.classList.remove('shake'), 400);
                    return;
                }
                selCats = selCats.filter(x => x !== k);
            } else selCats = selCats.concat([k]);
            saveCats(); Sfx.pop();
            renderCats(); renderGames();
        });
    }
    $('allWords').onclick = () => {
        selCats = CATS.map(c => c.key);
        saveCats(); Sfx.pop();
        renderCats(); renderGames();
    };
    function renderGames() {
        const sel = selection();
        $('poolInfo').textContent = `🎯 ${sel.pool.length} word${sel.pool.length === 1 ? '' : 's'} in your game pool`;
        $('gameNote').textContent = sel.pool.length ? ''
            : mode === 'lesson' ? 'No lessons picked yet — tap some weeks above! 📚'
            : 'Your word basket is empty — tap some categories above! 🧺';
        $('gameGrid').innerHTML = GAME_KEYS.map(key => {
            const def = Activities.defs[key];
            const ok = gameOk(key, sel);
            const best = bestFor(key);
            return `<div class="act-card game-card${ok ? '' : ' locked'}" data-game="${key}" data-ok="${ok ? 1 : 0}">
                <div class="a-icon">${def.icon}</div>
                <div class="a-name">${escHtml(def.name)}</div>
                <div class="a-jp">${escHtml(def.jp)}</div>
                <div class="a-stars">${!ok ? `<span class="lock-note">${mode === 'lesson' ? 'Pick more lessons! 📚' : 'Pick more categories! 🧺'}</span>`
                    : best ? '⭐'.repeat(best) : '<span style="color:#cfd8dc">not played yet</span>'}</div>
            </div>`;
        }).join('');
        $('gameGrid').querySelectorAll('.game-card').forEach(c => c.onclick = () => {
            if (c.dataset.ok !== '1') {
                c.classList.add('shake'); Sfx.wrong();
                setTimeout(() => c.classList.remove('shake'), 400);
                return;
            }
            openGame(c.dataset.game);
        });
    }
    // ---------- lesson picker ----------
    function renderMode() {
        $('modeChips').querySelectorAll('.mode-chip').forEach(b =>
            b.classList.toggle('active', b.dataset.mode === mode));
        $('topicMode').style.display = mode === 'topic' ? '' : 'none';
        $('lessonMode').style.display = mode === 'lesson' ? '' : 'none';
        $('modeHint').textContent = mode === 'lesson'
            ? 'Play with the exact words from lessons you have already finished. 📚'
            : 'Play with every word in the course, sorted into fun topics. 🧺';
    }
    function renderLessons() {
        const passed = passedList();
        selWeeks = prunedWeeks();
        if (!passed.length) {
            $('lessonNote').innerHTML = '🌱 No finished lessons yet! Play three games in a week on the '
                + '<a href="workbook.html">5-Year Journey</a> and it will appear here.';
            $('lessonYears').innerHTML = '';
            $('lessonPoolInfo').textContent = '';
            return;
        }
        $('lessonNote').textContent = passed.length + ' lesson' + (passed.length === 1 ? '' : 's')
            + ' unlocked — tap the weeks you want to play with!';
        const byYear = {};
        passed.forEach(p => (byYear[p.year] = byYear[p.year] || []).push(p.week));
        $('lessonYears').innerHTML = Object.keys(byYear).sort().map(y => {
            const meta = Journey.yearMeta(+y);
            return `<div class="yr-block"><h4>${escHtml(meta && meta.title ? meta.title : 'Year ' + y)}</h4>
              <div class="wk-chips">${byYear[y].map(w => {
                const wk = Journey.getWeek(+y, w);
                const on = selWeeks.indexOf(y + ':' + w) >= 0;
                return `<button class="wk-chip${on ? ' on' : ''}" data-wk="${y}:${w}">
                    ${wk.emoji} W${w} ${escHtml(wk.title)}</button>`;
              }).join('')}</div></div>`;
        }).join('');
        $('lessonYears').querySelectorAll('.wk-chip').forEach(b => b.onclick = () => {
            const k = b.dataset.wk;
            selWeeks = selWeeks.indexOf(k) >= 0 ? selWeeks.filter(x => x !== k) : selWeeks.concat([k]);
            saveWeeks(); Sfx.pop();
            renderLessons(); renderGames();
        });
        const sel = lessonSelection();
        $('lessonPoolInfo').textContent = `🎯 ${sel.pool.length} word${sel.pool.length === 1 ? '' : 's'} picked`;
    }
    $('allLessons').onclick = () => {
        selWeeks = passedList().map(p => p.year + ':' + p.week);
        saveWeeks(); Sfx.pop(); renderLessons(); renderGames();
    };
    $('lastLessons').onclick = () => {
        selWeeks = passedList().slice(-5).map(p => p.year + ':' + p.week);
        saveWeeks(); Sfx.pop(); renderLessons(); renderGames();
    };
    $('modeChips').querySelectorAll('.mode-chip').forEach(b => b.onclick = () => {
        if (b.dataset.mode === mode) return;
        mode = b.dataset.mode; saveMode(); Sfx.pop();
        renderAll();
    });

    function renderAll() { renderTotals(); renderMode(); renderLevels(); renderCats(); renderLessons(); renderGames(); }

    // ---------- activity modal ----------
    function writingChars(pool) {
        // hand the tracing game a spread of kana from the picked words
        const seen = new Set(), chars = [];
        shuffleArr(pool).forEach(v => {
            if (!/^[ぁ-ゖァ-ヶー]+$/.test(v.jp)) return;
            for (const c of v.jp) if (c !== 'ー' && !seen.has(c)) { seen.add(c); chars.push(c); }
        });
        return chars.slice(0, 8);
    }
    function openGame(key) {
        const def = Activities.defs[key];
        const sel = selection();
        $('modalTitle').textContent = def.icon + ' ' + def.name;
        modalOpenedAt = Date.now();
        $('modalBack').classList.add('open');
        if (activeRun) activeRun.teardown();
        // only the selected meaning-based baskets, for Odd One Out teams
        const catObjs = CATS.filter(c => c.meaning && selCats.includes(c.key))
            .map(c => ({ name: c.name, icon: c.icon, words: catWords(sel.pool, c) }))
            .filter(c => c.words.length);
        // real onComplete (never null) so arcade plays count for records
        activeRun = Activities.startCustom(key, $('actHost'), {
            pool: sel.pool,
            examples: sel.examples,
            kanjiPool: sel.kanji,
            writing: (sel.writingChars || []).length ? { type: 'kana', chars: sel.writingChars.slice(0, 10) } : null,
            categories: catObjs,
            prevBest: () => bestFor(key),
        }, stars => { recordBest(key, stars); renderTotals(); renderGames(); },
        closeModal);
    }
    function closeModal() {
        $('modalBack').classList.remove('open');
        if (activeRun) { activeRun.teardown(); activeRun = null; }
        $('actHost').innerHTML = '';
        JpSpeech.stop();
    }
    $('modalClose').onclick = closeModal;
    // ignore backdrop taps right after opening - the second tap of a child's
    // double-tap on a game card lands on the backdrop and would insta-close
    $('modalBack').addEventListener('click', e => {
        if (e.target === $('modalBack') && Date.now() - modalOpenedAt > 350) closeModal();
    });

    // Tako-chan hosts the arcade (tap = wiggle + hear the line)
    const TAKO = [
        ['あそぼう あそぼう！', "Let's play, let's play!"],
        ['もう いっかい？', 'One more time?'],
        ['こんどは まけないぞ〜！', "I won't lose this time!"],
        ['うわー、つよいね！', "Whoa, you're strong!"],
    ];
    (function () {
        const line = TAKO[Math.floor(Math.random() * TAKO.length)];
        $('takoJp').textContent = line[0];
        $('takoEn').textContent = line[1];
        $('tako').onclick = () => {
            const m = $('tako');
            m.classList.remove('wiggle'); void m.offsetWidth; m.classList.add('wiggle');
            if (!$('modalBack').classList.contains('open')) JpSpeech.speak($('takoJp').textContent);
        };
    })();

    rebuildLevel();
    renderAll();

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
})();
</script>
</body>
</html>
