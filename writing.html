    // =========================================================================
    // SHOW ME ANIMATION - Uses KanjiVG open-source stroke order SVG data
    // KanjiVG (c) Ulrich Apel - Creative Commons Attribution-Share Alike 3.0
    // =========================================================================
    const kvgCache = {};

    // Parse SVG path d attribute into array of {x,y} points
    function parseSvgPath(d, steps) {
        const pts = [];
        // Tokenize
        const tokens = d.match(/[a-zA-Z]|[-+]?[0-9]*\.?[0-9]+/g) || [];
        let i = 0, cx = 0, cy = 0, lastCx2 = 0, lastCy2 = 0, lastCmd = '';

        function num() { return parseFloat(tokens[i++]); }

        function cubicBezier(x0,y0,x1,y1,x2,y2,x3,y3,n) {
            for (let s = 1; s <= n; s++) {
                const t = s / n, u = 1 - t;
                pts.push({
                    x: u*u*u*x0 + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3,
                    y: u*u*u*y0 + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3
                });
            }
        }

        while (i < tokens.length) {
            const cmd = /[a-zA-Z]/.test(tokens[i]) ? tokens[i++] : lastCmd;
            lastCmd = cmd;

            if (cmd === 'M') {
                cx = num(); cy = num();
                pts.push({x: cx, y: cy});
            } else if (cmd === 'm') {
                cx += num(); cy += num();
                pts.push({x: cx, y: cy});
            } else if (cmd === 'L') {
                const x = num(), y = num();
                cubicBezier(cx,cy, cx,cy, x,y, x,y, steps);
                cx = x; cy = y;
            } else if (cmd === 'l') {
                const x = cx+num(), y = cy+num();
                cubicBezier(cx,cy, cx,cy, x,y, x,y, steps);
                cx = x; cy = y;
            } else if (cmd === 'C') {
                const x1=num(),y1=num(),x2=num(),y2=num(),x3=num(),y3=num();
                cubicBezier(cx,cy,x1,y1,x2,y2,x3,y3,steps);
                lastCx2=x2; lastCy2=y2; cx=x3; cy=y3;
            } else if (cmd === 'c') {
                const x1=cx+num(),y1=cy+num(),x2=cx+num(),y2=cy+num(),x3=cx+num(),y3=cy+num();
                cubicBezier(cx,cy,x1,y1,x2,y2,x3,y3,steps);
                lastCx2=x2; lastCy2=y2; cx=x3; cy=y3;
            } else if (cmd === 'S') {
                const x1=2*cx-lastCx2, y1=2*cy-lastCy2;
                const x2=num(),y2=num(),x3=num(),y3=num();
                cubicBezier(cx,cy,x1,y1,x2,y2,x3,y3,steps);
                lastCx2=x2; lastCy2=y2; cx=x3; cy=y3;
            } else if (cmd === 's') {
                const x1=2*cx-lastCx2, y1=2*cy-lastCy2;
                const x2=cx+num(),y2=cy+num(),x3=cx+num(),y3=cy+num();
                cubicBezier(cx,cy,x1,y1,x2,y2,x3,y3,steps);
                lastCx2=x2; lastCy2=y2; cx=x3; cy=y3;
            } else if (cmd === 'Z' || cmd === 'z') {
                // close path - ignore for stroke animation
            } else {
                i++; // skip unknown
            }
        }
        return pts;
    }

    // Fetch and parse KanjiVG SVG for a character
    async function getKvgPaths(char) {
        if (kvgCache[char]) return kvgCache[char];

        // Embedded local data first (kanjivg_data.js) - works offline and on file://
        if (window.KVG_DATA && window.KVG_DATA[char]) {
            const strokes = window.KVG_DATA[char].map(d => parseSvgPath(d, 8)).filter(p => p.length > 0);
            if (strokes.length > 0) {
                kvgCache[char] = strokes;
                return strokes;
            }
        }

        const code = char.codePointAt(0).toString(16).padStart(5, '0');
        const url = 'https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/' + code + '.svg';

        try {
            const resp = await fetch(url);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const svgText = await resp.text();

            // Parse path d attributes from SVG
            const pathRegex = /<path[^>]*\sd="([^"]+)"/g;
            const strokes = [];
            let match;
            while ((match = pathRegex.exec(svgText)) !== null) {
                const d = match[1];
                const points = parseSvgPath(d, 8); // 8 samples per bezier segment
                if (points.length > 0) strokes.push(points);
            }

            kvgCache[char] = strokes;
            return strokes;
        } catch(e) {
            console.log('KanjiVG fetch failed for ' + char + ':', e);
            return null;
        }
    }

    // Scale KanjiVG coords (109x109 viewbox) to our canvas
    function scaleKvgToCanvas(strokes, canvasW) {
        const pad = canvasW * 0.08;
        const area = canvasW - pad * 2;
        // KanjiVG uses 109x109 coordinate system
        const scale = area / 109;
        const offset = pad;

        return strokes.map(stroke =>
            stroke.map(pt => ({
                x: offset + pt.x * scale,
                y: offset + pt.y * scale
            }))
        );
    }

    function showMe() {
        if (showingAnimation) return;
        showingAnimation = true;
        // Capture this run's generation - Clear/Next/Prev/tab-switch bump animGen,
        // which makes every pending callback below bail out instead of painting
        // stale strokes over the new character.
        const myGen = ++animGen;
        userStrokes = [];
        currentStroke = null;
        // release any finger mid-stroke, or startStroke() would reject every
        // future touch and permanently lock the canvas
        isDrawing = false;
        activeTouchId = null;

        const data = getCurrentChar();
        const w = drawCanvas.width;
        const lineW = Math.max(3, w * 0.012);

        redrawCanvas();

        // Fetch KanjiVG paths, then animate
        getKvgPaths(data.char).then(kvgStrokes => {
            if (myGen !== animGen) return; // cancelled while fetching
            if (!kvgStrokes || kvgStrokes.length === 0) {
                // Fallback: just show the character in pink briefly
                drawCtx.save();
                drawCtx.globalAlpha = 0.6;
                drawCtx.fillStyle = '#e91e63';
                const pad = w * 0.08, area = w - pad*2;
                drawCtx.font = 'bold ' + Math.floor(area*0.88) + 'px "Noto Sans JP", sans-serif';
                drawCtx.textAlign = 'center';
                drawCtx.textBaseline = 'middle';
                drawCtx.fillText(data.char, w/2, w/2 + area*0.03);
                drawCtx.restore();
                showingAnimation = false;
                return;
            }

            const scaledStrokes = scaleKvgToCanvas(kvgStrokes, w);
            let strokeIdx = 0;
            // Demo strokes live in their own array - putting them in
            // userStrokes let "Show Me" + "Check" pass with a perfect score
            // without the kid drawing anything.
            const animStrokes = [];

            function animateNextStroke() {
                if (myGen !== animGen) return; // cancelled
                if (strokeIdx >= scaledStrokes.length) {
                    showingAnimation = false;
                    updateStrokeCounter();
                    return;
                }

                const animPts = scaledStrokes[strokeIdx];
                let ptIdx = 0;
                const drawnPts = [];

                function drawNext() {
                    if (myGen !== animGen) return; // cancelled
                    if (ptIdx >= animPts.length) {
                        animStrokes.push(drawnPts.slice());
                        strokeIdx++;
                        setTimeout(animateNextStroke, 350);
                        return;
                    }

                    drawnPts.push(animPts[ptIdx]);
                    ptIdx++;

                    drawCtx.clearRect(0, 0, w, w);
                    drawGuideOnMain();

                    animStrokes.forEach(s => {
                        if (s.length >= 2) drawStrokePath(s, '#e91e63', lineW);
                    });

                    if (drawnPts.length >= 2) {
                        drawStrokePath(drawnPts, '#e91e63', lineW);
                    }

                    if (drawnPts.length > 0) {
                        const tip = drawnPts[drawnPts.length - 1];
                        drawCtx.fillStyle = '#e91e63';
                        drawCtx.beginPath();
                        drawCtx.arc(tip.x, tip.y, lineW + 2, 0, Math.PI * 2);
                        drawCtx.fill();
                    }

                    updateStrokeCounter();
                    requestAnimationFrame(drawNext);
                }

                drawNext();
            }

            animateNextStroke();
        });
    }

    // =========================================================================
    // SOUND EFFECTS (Web Audio API, matching main site)
    // =========================================================================
    // SPEECH - pronounce character readings
    // =========================================================================
    function speakJapanese(text) {
        speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'ja-JP';
        utter.rate = 0.8;
        utter.pitch = 1.2;
        utter.volume = 1.0; // maximum volume
        const voices = speechSynthesis.getVoices();
        const jaVoice = voices.find(v => v.lang.startsWith('ja') && /female|woman|kyoko|haruka/i.test(v.name))
                      || voices.find(v => v.lang.startsWith('ja'));
        if (jaVoice) utter.voice = jaVoice;
        speechSynthesis.speak(utter);
    }

    function speakCurrentChar() {
        const data = getCurrentChar();
        if (currentMode.startsWith('kanji') && data.onyomi) {
            // Speak: character, then on'yomi, then kun'yomi
            const parts = [];
            parts.push(data.char);
            if (data.onyomi) parts.push(data.onyomi);
            if (data.kunyomi) parts.push(data.kunyomi);
            speakJapanese(parts.join('、'));
        } else {
            speakJapanese(data.char);
        }
    }

    // =========================================================================
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSfx(type) {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        if (type === 'correct') {
            // Happy ascending chime - pitch climbs a little as the streak grows
            const pitchMult = 1 + 0.06 * Math.min(streak, 4);
            [523, 659, 784].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq * pitchMult;
                gain.gain.setValueAtTime(0.18, now + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now + i * 0.12);
                osc.stop(now + i * 0.12 + 0.4);
            });
        } else if (type === 'wrong') {
            // Low buzz
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = 180;
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'fanfare') {
            // Row-complete fanfare: five ascending notes
            [523, 587, 659, 784, 1047].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.18, now + i * 0.13);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.4);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now + i * 0.13);
                osc.stop(now + i * 0.13 + 0.45);
            });
        }
    }

    // =========================================================================
    // KEYBOARD SHORTCUTS
    // =========================================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') nextChar();
        else if (e.key === 'ArrowLeft') prevChar();
        else if (e.key === 'Escape' || e.key === 'Delete') clearCanvas();
        else if (e.key === 'Enter') checkDrawing();
    });

    // =========================================================================
    // INIT
    // =========================================================================
    let fontLoaded = false;

    // Preload all KanjiVG SVGs in the background
    function preloadAllKvg() {
        const allChars = [...hiraganaData, ...katakanaData, ...kanjiData].map(d => d.char);
        let i = 0;
        // Fetch 4 at a time to avoid overwhelming the connection
        function fetchBatch() {
            const batch = allChars.slice(i, i + 4);
            if (batch.length === 0) return;
            i += 4;
            Promise.all(batch.map(c => getKvgPaths(c).catch(() => null)))
                .then(() => setTimeout(fetchBatch, 50));
        }
        fetchBatch();
    }

    function init() {
        buildCharGrid();
        resizeCanvas();
        updateUI();
        preloadAllKvg();
    }

    // Wait for the Japanese font to load before drawing guides
    function waitForFont() {
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                fontLoaded = true;
                // Drop any mask rendered with the fallback font
                guidePixelCache = { char: null, mask: null, w: 0 };
                resizeCanvas();
                updateUI();
            });
        }
        // Also try loading it explicitly
        if (document.fonts && document.fonts.load) {
            document.fonts.load('bold 100px "Noto Sans JP"', 'あ').then(() => {
                fontLoaded = true;
                resizeCanvas();
                updateUI();
            }).catch(() => {});
        }
        // Fallback: retry after a delay
        setTimeout(() => {
            if (!fontLoaded) {
                fontLoaded = true;
                resizeCanvas();
                updateUI();
            }
        }, 2000);
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        updateUI();
    });

    // Ensure audio context is created on first user interaction (iOS requirement)
    document.addEventListener('touchstart', function initAudio() {
        getAudioCtx();
        document.removeEventListener('touchstart', initAudio);
    }, { once: true });

    document.addEventListener('click', function initAudio() {
        getAudioCtx();
        document.removeEventListener('click', initAudio);
    }, { once: true });

    init();
    waitForFont();
    </script>
    <script>
        // Offline support: caches all course assets after the first visit
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
