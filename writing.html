<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fiona's Writing">
    <title>Fiona's Hiragana Writing Practice</title>
    <style>
        @import url('fonts/fonts.css'); /* local Nunito + Noto Sans JP (offline-capable) */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 30%, #e0f7fa 60%, #fff3e0 100%);
            min-height: 100vh;
            background-attachment: fixed;
            overflow-x: hidden;
            padding: 0 0 40px 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 183, 197, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(179, 229, 252, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 245, 157, 0.2) 0%, transparent 50%);
            z-index: 0;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 18px 20px 14px;
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.6em;
            font-weight: 800;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #3f51b5, #00bcd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .header-links a {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .header-links a:active {
            transform: scale(0.95);
        }

        .back-link {
            background: linear-gradient(135deg, #fff9c4, #ffe0b2);
            color: #f57f17;
        }

        .workbook-link {
            background: linear-gradient(135deg, #f8bbd0, #f48fb1);
            color: #880e4f;
        }

        /* Main layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        /* Progress bar */
        .progress-section {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .progress-label {
            font-size: 0.85em;
            font-weight: 700;
            color: #78909c;
            margin-bottom: 6px;
        }

        .progress-bar-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ce93d8, #64b5f6, #4db6ac);
            border-radius: 5px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-count {
            font-size: 0.8em;
            font-weight: 700;
            color: #b0bec5;
            margin-top: 4px;
            text-align: right;
        }

        /* Character grid */
        .char-grid-section {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .char-grid-section h3 {
            font-size: 0.85em;
            font-weight: 700;
            color: #78909c;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .char-row-label {
            font-size: 0.85em;
            font-weight: 800;
            color: #90a4ae;
            margin-top: 12px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .char-row-label:first-child {
            margin-top: 0;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .char-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid transparent;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.6em;
            font-weight: 700;
            color: #546e7a;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .char-btn:active {
            transform: scale(0.92);
        }

        .char-btn.active {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: white;
            border-color: #ab47bc;
            box-shadow: 0 3px 12px rgba(171, 71, 188, 0.3);
        }

        .char-btn.practiced {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            color: #2e7d32;
        }

        .char-btn.practiced.active {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: white;
        }

        .char-btn .check-mark {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 14px;
            height: 14px;
            background: #43a047;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.45em;
            color: white;
            font-weight: 800;
        }

        /* Practice area */
        .practice-area {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Kanji picture panel */
        .kanji-picture-panel {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            flex: 0 0 130px;
            min-width: 110px;
        }

        .kanji-pic-emoji {
            font-size: 4em;
            line-height: 1.1;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.1));
        }

        .kanji-pic-english {
            font-size: 1.2em;
            font-weight: 800;
            color: #37474f;
            margin-bottom: 4px;
        }

        .kanji-pic-reading {
            font-size: 0.85em;
            font-weight: 600;
            color: #90a4ae;
            white-space: pre-line;
            line-height: 1.4;
        }

        .kanji-pic-speak {
            margin-top: 12px;
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            font-size: 1.4em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 12px rgba(171, 71, 188, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
        }

        .kanji-pic-speak:active {
            transform: scale(0.9);
        }

        /* Reference panel */
        .reference-panel {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            flex: 0 0 160px;
            min-width: 140px;
        }

        .ref-char {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 120px;
            font-weight: 700;
            line-height: 1.1;
            color: #37474f;
            position: relative;
            display: inline-block;
        }

        .ref-romaji {
            font-size: 1.1em;
            font-weight: 700;
            color: #78909c;
            margin-top: 2px;
        }

        .ref-strokes {
            font-size: 0.85em;
            font-weight: 700;
            color: #b0bec5;
            margin-top: 4px;
        }

        .ref-stroke-order {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed rgba(0,0,0,0.08);
        }

        .ref-stroke-order canvas {
            border-radius: 12px;
            background: #fafafa;
        }

        /* Canvas area */
        .canvas-wrapper {
            flex: 1;
            min-width: 280px;
        }

        .drawing-canvas-container {
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 3px solid rgba(206, 147, 216, 0.3);
            aspect-ratio: 1 / 1;
            max-width: 400px;
            width: 100%;
        }

        .drawing-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Grid lines on canvas */
        .canvas-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .canvas-grid::before,
        .canvas-grid::after {
            content: '';
            position: absolute;
            background: rgba(206, 147, 216, 0.15);
        }

        .canvas-grid::before {
            left: 50%;
            top: 10%;
            width: 1px;
            height: 80%;
            border-left: 1px dashed rgba(206, 147, 216, 0.3);
        }

        .canvas-grid::after {
            top: 50%;
            left: 10%;
            height: 1px;
            width: 80%;
            border-top: 1px dashed rgba(206, 147, 216, 0.3);
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            color: white;
            min-width: 80px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-clear {
            background: linear-gradient(135deg, #ffab91, #ff8a65);
        }

        .btn-show {
            background: linear-gradient(135deg, #90caf9, #64b5f6);
        }

        .btn-check {
            background: linear-gradient(135deg, #a5d6a7, #66bb6a);
        }

        .btn-next {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
        }

        .btn-prev {
            background: linear-gradient(135deg, #b0bec5, #90a4ae);
        }

        /* Feedback message */
        .feedback {
            text-align: center;
            margin-top: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-msg {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 22px;
            font-weight: 800;
            font-size: 1.05em;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .feedback-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-msg.great {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            color: #2e7d32;
        }

        .feedback-msg.tryagain {
            background: linear-gradient(135deg, #fff9c4, #fff176);
            color: #f57f17;
        }

        .feedback-msg.wrong {
            background: linear-gradient(135deg, #ffcdd2, #ef9a9a);
            color: #c62828;
        }

        /* Stroke counter overlay */
        .stroke-counter {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.8em;
            font-weight: 700;
            color: #78909c;
            z-index: 5;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.3em;
            }

            .practice-area {
                flex-direction: column;
                align-items: center;
            }

            .reference-panel {
                flex: none;
                width: 100%;
                display: flex;
                align-items: center;
                gap: 14px;
                text-align: left;
                padding: 12px 16px;
            }

            .ref-char {
                font-size: 80px;
                flex-shrink: 0;
            }

            .ref-info {
                flex: 1;
            }

            .ref-stroke-order {
                border-top: none;
                margin-top: 0;
                padding-top: 0;
            }

            .canvas-wrapper {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .drawing-canvas-container {
                max-width: 360px;
            }

            .char-btn {
                width: 36px;
                height: 36px;
                font-size: 1.05em;
            }

            .container {
                padding: 10px;
            }
        }

        @media (min-width: 641px) {
            .reference-panel {
                position: sticky;
                top: 100px;
            }
        }

        /* Animation for feedback */
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .feedback-msg.show {
            animation: bounceIn 0.4s ease forwards;
        }

        /* Stars animation for correct answer */
        @keyframes starFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.5); opacity: 0; }
        }

        .star-particle {
            position: absolute;
            font-size: 1.4em;
            pointer-events: none;
            animation: starFloat 1s ease forwards;
        }

        /* Character mode tabs */
        .char-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .char-tab {
            flex: 1;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.5);
            color: #78909c;
        }
        .char-tab.active {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: white;
            box-shadow: 0 3px 12px rgba(171,71,188,0.3);
        }
        .char-btn-kanji {
            width: 100%;
            aspect-ratio: auto;
            padding: 8px 4px;
            font-size: 1.4em;
        }
        .char-btn-kanji .kanji-emoji {
            font-size: 0.6em;
            display: block;
        }

        /* ---------- cute mascot kit ---------- */
        .mascot-row { display: flex; align-items: flex-end; gap: 10px; justify-content: center; margin: 10px 0; }
        .mascot {
            font-size: 2.6em; display: inline-block; cursor: pointer;
            animation: mascotBob 2.6s ease-in-out infinite; transform-origin: 50% 90%;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.12));
        }
        .mascot.small { font-size: 1.7em; }
        .mascot.wiggle { animation: mascotWiggle 0.5s ease-in-out; }
        @keyframes mascotBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
        @keyframes mascotWiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
        .mascot-bubble {
            position: relative; background: #fff; border: 2px solid #f8bbd0; border-radius: 16px;
            padding: 8px 14px; font-weight: 800; color: #ad1457; font-size: 0.92em;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06); max-width: 340px; text-align: left;
        }
        .mascot-bubble::before { content: ''; position: absolute; left: -16px; bottom: 12px; border: 8px solid transparent; border-right-color: #f8bbd0; }
        .mascot-bubble::after  { content: ''; position: absolute; left: -12px; bottom: 13px; border: 7px solid transparent; border-right-color: #fff; }
        .mascot-bubble .mb-jp { color: #6a1b9a; display: block; font-family: 'Noto Sans JP', sans-serif; }
        .mascot-bubble .mb-en { color: #ad1457; font-size: 0.85em; font-weight: 700; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Fiona's Hiragana Writing Practice</h1>
        <div class="header-links">
            <a href="index.html" class="back-link">Back to Flashcards</a>
            <a href="ebook.html" class="workbook-link">Workbook</a>
        </div>
    </div>

    <div class="container">
        <!-- Piyo-chan the cheerleader -->
        <div class="mascot-row">
            <span class="mascot" id="piyoMascot" onclick="piyoTap()">🐣</span>
            <div class="mascot-bubble">
                <span class="mb-jp" id="piyoJp">ゆっくりで いいよ</span>
                <span class="mb-en" id="piyoEn">Take your time!</span>
            </div>
        </div>

        <!-- Practice Area FIRST -->
        <div class="practice-area">
            <!-- Reference -->
            <div class="reference-panel">
                <div class="ref-char" id="refChar">あ</div>
                <div class="ref-info">
                    <div class="ref-romaji" id="refRomaji">a</div>
                    <div class="ref-strokes" id="refStrokes">3 strokes</div>
                    <div class="ref-stroke-order">
                        <canvas id="guideCanvas" width="120" height="120"></canvas>
                    </div>
                </div>
            </div>

            <!-- Drawing -->
            <div class="canvas-wrapper">
                <div class="drawing-canvas-container" id="canvasContainer">
                    <canvas id="drawCanvas"></canvas>
                    <div class="canvas-grid"></div>
                    <div class="stroke-counter" id="strokeCounter">Strokes: 0</div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn btn-clear" onclick="clearCanvas()">Clear</button>
                    <button class="action-btn btn-show" onclick="showMe()">Show Me</button>
                    <button class="action-btn btn-check" onclick="checkDrawing()">Check</button>
                    <button class="action-btn btn-prev" onclick="prevChar()">Prev</button>
                    <button class="action-btn btn-next" onclick="nextChar()">Next</button>
                </div>
                <div class="feedback">
                    <div class="feedback-msg" id="feedbackMsg"></div>
                </div>
            </div>

            <!-- Kanji picture panel (only visible in kanji mode) -->
            <div class="kanji-picture-panel" id="kanjiPicturePanel" style="display:none;">
                <div class="kanji-pic-emoji" id="kanjiPicEmoji"></div>
                <div class="kanji-pic-english" id="kanjiPicEnglish"></div>
                <div class="kanji-pic-reading" id="kanjiPicReading"></div>
                <button class="kanji-pic-speak" id="kanjiPicSpeak" onclick="speakCurrentChar()">&#x1F50A;</button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-label">Your Progress</div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-count" id="progressCount">0 / 46 practiced</div>
        </div>

        <!-- Character Grid BELOW with more space -->
        <div class="char-grid-section">
            <div class="char-tabs">
                <button class="char-tab active" id="tabHiragana" onclick="switchMode('hiragana')">Hiragana</button>
                <button class="char-tab" id="tabKatakana" onclick="switchMode('katakana')">Katakana</button>
                <button class="char-tab" id="tabKanji1" onclick="switchMode('kanji1')">1st Grade</button>
                <button class="char-tab" id="tabKanji2" onclick="switchMode('kanji2')">2nd Grade</button>
            </div>
            <h3>Choose a character to practice:</h3>
            <div id="charGridContainer"></div>
        </div>
    </div>

    <script src="kanjivg_data.js"></script>
    <script>
    // =========================================================================
    // HIRAGANA DATA - All 46 basic characters with stroke data
    // =========================================================================
    // Each character: { char, romaji, strokes: count, row, paths: array of stroke path data }
    // Each path: { points: [[x,y],...], dir: direction }
    // Coordinates are normalized 0-1 within the character cell
    // dir values: 'right','left','down','up','curve-right','curve-left','down-right',
    //             'down-left','up-curve','loop','hook-left','hook-right'

    const hiraganaData = [
        // --- A row ---
        { char: 'あ', romaji: 'a', strokes: 3, row: 'a', paths: [
            // Stroke 1: horizontal stroke across upper area, slight downward curve
            { points: [[0.18,0.35],[0.26,0.34],[0.34,0.34],[0.42,0.34],[0.50,0.34],[0.58,0.34],[0.66,0.35],[0.78,0.35]], dir: 'right' },
            // Stroke 2: vertical from top-center, curving slightly left at bottom
            { points: [[0.48,0.15],[0.48,0.22],[0.47,0.29],[0.47,0.35],[0.46,0.42],[0.44,0.50],[0.42,0.58],[0.40,0.65],[0.38,0.72]], dir: 'down' },
            // Stroke 3: the loop - starts left of center, curves right, down, left, and back up-left
            { points: [[0.25,0.50],[0.32,0.47],[0.40,0.45],[0.50,0.45],[0.58,0.47],[0.65,0.51],[0.70,0.56],[0.72,0.62],[0.70,0.68],[0.65,0.73],[0.58,0.76],[0.50,0.76],[0.42,0.74],[0.35,0.72],[0.30,0.70]], dir: 'loop' }
        ]},
        { char: 'い', romaji: 'i', strokes: 2, row: 'a', paths: [
            // Stroke 1: left stroke, slightly curving leftward as it descends

    kanjiData.forEach(k => {
        const r = kanjiReadings[k.char];
        if (r) { k.onyomi = r[0]; k.kunyomi = r[1]; }
    });

    const kanjiRowNames = {
        'numbers': '1st Grade - Numbers',
        'nature': '1st Grade - Nature',
        'people': '1st Grade - People',
        'body': '1st Grade - Body',
        'direction': '1st Grade - Direction & Size',
        'time': '1st Grade - Time & Calendar',
        'objects': '1st Grade - Objects',
        'actions2': '2nd Grade - Actions',
        'nature2': '2nd Grade - Nature & Places',
        'family2': '2nd Grade - People & Family',
        'time2': '2nd Grade - Time & Numbers',
        'places2': '2nd Grade - Animals & Places',
        'descriptive2': '2nd Grade - Descriptive',
        'school2': '2nd Grade - School & Abstract'
    };

    // State
    const kanji1stGrade = kanjiData.filter(k => ['numbers','nature','people','body','direction','time','objects'].includes(k.row));
    const kanji2ndGrade = kanjiData.filter(k => ['actions2','nature2','family2','time2','places2','descriptive2','school2'].includes(k.row));

    let currentMode = 'hiragana'; // 'hiragana', 'katakana', 'kanji1', or 'kanji2'
    let currentIndex = 0;
    let practiced = new Set();
    let practicedKatakana = new Set();
    let practicedKanji = new Set();
    let userStrokes = []; // Array of strokes, each stroke = array of {x,y} points
    let currentStroke = null;
    let isDrawing = false;
    let activeTouchId = null; // identifier of the finger that started the stroke
    let showingAnimation = false;
    let animGen = 0; // generation counter - bumping it cancels a running Show Me animation
    let scored = false; // this drawing already passed Check - block re-grading the same strokes
    let streak = 0; // consecutive correct checks - grows the celebration
    let rainbowInk = false; // display-only reward ink after finishing a whole row

    // Load progress from localStorage
    try {
        const saved = localStorage.getItem('fiona-writing-progress');
        if (saved) practiced = new Set(JSON.parse(saved));
    } catch(e) {}
    try {
        const savedKatakana = localStorage.getItem('fiona-katakana-progress');
        if (savedKatakana) practicedKatakana = new Set(JSON.parse(savedKatakana));
    } catch(e) {}
    try {
        const savedKanji = localStorage.getItem('yuna-kanji-progress');
        if (savedKanji) practicedKanji = new Set(JSON.parse(savedKanji));
    } catch(e) {}

    // Helper to get current data array
    function getCurrentData() {
        if (currentMode === 'kanji1') return kanji1stGrade;
        if (currentMode === 'kanji2') return kanji2ndGrade;
        if (currentMode === 'katakana') return katakanaData;
        return hiraganaData;
    }

    function getCurrentChar() {
        return getCurrentData()[currentIndex];
    }

    // =========================================================================
    // MODE SWITCHING (Hiragana / Kanji)
    // =========================================================================
    function switchMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        currentIndex = 0;

        // Update tab buttons
        document.getElementById('tabHiragana').classList.toggle('active', mode === 'hiragana');
        document.getElementById('tabKatakana').classList.toggle('active', mode === 'katakana');
        document.getElementById('tabKanji1').classList.toggle('active', mode === 'kanji1');
        document.getElementById('tabKanji2').classList.toggle('active', mode === 'kanji2');

        clearCanvas();
        buildCharGrid();
        updateUI();
    }

    // =========================================================================
    // BUILD CHARACTER GRID
    // =========================================================================
    function buildCharGrid() {
        const container = document.getElementById('charGridContainer');
        container.innerHTML = '';

        if (currentMode === 'kanji1' || currentMode === 'kanji2') {
            buildKanjiGrid(container);
        } else {
            buildHiraganaGrid(container);
        }
    }

    function buildHiraganaGrid(container) {
        // Shared kana grid - serves both the hiragana and katakana tabs
        const isKatakana = currentMode === 'katakana';
        const data = isKatakana ? katakanaData : hiraganaData;
        const names = isKatakana ? katakanaRowNames : rowNames;
        const practicedSet = isKatakana ? practicedKatakana : practiced;
        const rowOrder = isKatakana
            ? ['a','ka','sa','ta','na','ha','ma','ya','ra','wa','ga','za','da','ba','pa']
            : ['a','ka','sa','ta','na','ha','ma','ya','ra','wa'];

        rowOrder.forEach(row => {
            const label = document.createElement('div');
            label.className = 'char-row-label';
            label.textContent = names[row];
            container.appendChild(label);

            const grid = document.createElement('div');
            grid.className = 'char-grid';

            data.forEach((h, idx) => {
                if (h.row !== row) return;
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.textContent = h.char;
                btn.dataset.index = idx;

                if (practicedSet.has(h.char)) {
                    btn.classList.add('practiced');
                    const check = document.createElement('span');
                    check.className = 'check-mark';
                    check.textContent = '\u2713';
                    btn.appendChild(check);
                }

                if (idx === currentIndex) btn.classList.add('active');

                btn.addEventListener('click', () => {
                    selectChar(idx);
                });

                grid.appendChild(btn);
            });

            container.appendChild(grid);
        });
    }

    function buildKanjiGrid(container) {
        const data = getCurrentData();
        const rowOrder = currentMode === 'kanji2'
            ? ['actions2','nature2','family2','time2','places2','descriptive2','school2']
            : ['numbers','nature','people','body','direction','time','objects'];

        rowOrder.forEach(row => {
            const label = document.createElement('div');
            label.className = 'char-row-label';
            label.textContent = kanjiRowNames[row];
            container.appendChild(label);

            const grid = document.createElement('div');
            grid.className = 'char-grid';

            data.forEach((k, idx) => {
                if (k.row !== row) return;
                const btn = document.createElement('button');
                btn.className = 'char-btn char-btn-kanji';
                btn.dataset.index = idx;

                const emojiSpan = document.createElement('span');
                emojiSpan.className = 'kanji-emoji';
                emojiSpan.textContent = k.emoji;
                btn.appendChild(emojiSpan);
                btn.appendChild(document.createTextNode(k.char));

                if (practicedKanji.has(k.char)) {
                    btn.classList.add('practiced');
                    const check = document.createElement('span');
                    check.className = 'check-mark';
                    check.textContent = '\u2713';
                    btn.appendChild(check);
                }

                if (idx === currentIndex) btn.classList.add('active');

                btn.addEventListener('click', () => {
                    selectChar(idx);
                });

                grid.appendChild(btn);
            });

            container.appendChild(grid);
        });
    }

    function selectChar(idx) {
        currentIndex = idx;
        clearCanvas();
        updateUI();
        hideFeedback();
    }

    function updateUI() {
        const data = getCurrentChar();

        // Update reference
        document.getElementById('refChar').textContent = data.char;
        if (currentMode.startsWith('kanji')) {
            document.getElementById('refRomaji').textContent = data.romaji + ' — ' + data.english;
        } else {
            document.getElementById('refRomaji').textContent = data.romaji;
        }
        document.getElementById('refStrokes').textContent = data.strokes + (data.strokes === 1 ? ' stroke' : ' strokes');

        // Show/hide kanji picture panel
        const picPanel = document.getElementById('kanjiPicturePanel');
        if (currentMode.startsWith('kanji') && data.emoji) {
            picPanel.style.display = 'block';
            document.getElementById('kanjiPicEmoji').textContent = data.emoji;
            document.getElementById('kanjiPicEnglish').textContent = data.english;
            let readingText = '';
            if (data.onyomi) readingText += 'On: ' + data.onyomi;
            if (data.kunyomi) readingText += (readingText ? '\n' : '') + 'Kun: ' + data.kunyomi;
            document.getElementById('kanjiPicReading').textContent = readingText || data.romaji;
        } else {
            picPanel.style.display = 'none';
        }

        // Update grid highlights
        document.querySelectorAll('.char-btn').forEach(btn => {
            btn.classList.remove('active');
            if (parseInt(btn.dataset.index) === currentIndex) {
                btn.classList.add('active');
            }
        });

        // Draw guide
        drawGuide();

        // Update progress
        updateProgress();

        // Draw guide strokes on main canvas
        drawGuideOnMain();
    }

    function updateProgress() {
        let total, done;
        if (currentMode.startsWith('kanji')) {
            // Scope to the visible tab's kanji set (1st or 2nd grade), matching the kana tabs
            const dataArr = getCurrentData();
            total = dataArr.length;
            done = dataArr.filter(k => practicedKanji.has(k.char)).length;
        } else if (currentMode === 'katakana') {
            total = katakanaData.length;
            done = practicedKatakana.size;
        } else {
            total = hiraganaData.length;
            done = practiced.size;
        }
        const pct = (done / total) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressCount').textContent = done + ' / ' + total + ' practiced';
    }

    // =========================================================================
    // GUIDE CANVAS (small reference)
    // =========================================================================
    // Cache for KanjiVG guide data on small reference canvas
    let guideKvgSmallCache = {};

    function drawGuide() {
        const canvas = document.getElementById('guideCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h_c = canvas.height;
        ctx.clearRect(0, 0, w, h_c);

        const data = getCurrentChar();

        // Draw cross guides
        ctx.strokeStyle = 'rgba(206, 147, 216, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(w/2, 8); ctx.lineTo(w/2, h_c-8);
        ctx.moveTo(8, h_c/2); ctx.lineTo(w-8, h_c/2);
        ctx.stroke();
        ctx.setLineDash([]);

        const pad = w * 0.08;
        const area = w - pad * 2;

        // Draw KanjiVG paths as dashed guide if cached
        if (guideKvgSmallCache[data.char]) {
            const kvgStrokes = guideKvgSmallCache[data.char];
            ctx.save();
            ctx.globalAlpha = 0.35;
            ctx.strokeStyle = '#90a4ae';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.setLineDash([4, 3]);
            kvgStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(pad + stroke[0].x * area / 109, pad + stroke[0].y * area / 109);
                for (let j = 1; j < stroke.length; j++) {
                    ctx.lineTo(pad + stroke[j].x * area / 109, pad + stroke[j].y * area / 109);
                }
                ctx.stroke();
            });
            ctx.setLineDash([]);
            ctx.restore();

            // Stroke order numbers at start of each KanjiVG stroke
            kvgStrokes.forEach((stroke, i) => {
                if (stroke.length === 0) return;
                const sx = pad + stroke[0].x * area / 109;
                const sy = pad + stroke[0].y * area / 109;
                ctx.fillStyle = '#e91e63';
                ctx.beginPath();
                ctx.arc(sx, sy, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('' + (i + 1), sx, sy);
            });
        } else {
            // Fallback: use local path data for stroke numbers until KanjiVG loads
            data.paths.forEach((stroke, i) => {
                const pts = stroke.points;
                const sx = pad + pts[0][0] * area;
                const sy = pad + pts[0][1] * area;
                ctx.fillStyle = '#e91e63';
                ctx.beginPath();
                ctx.arc(sx, sy, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = 'bold 9px Nunito, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('' + (i + 1), sx, sy);
            });

            // Trigger async fetch
            getKvgPaths(data.char).then(kvgStrokes => {
                if (kvgStrokes && kvgStrokes.length > 0) {
                    guideKvgSmallCache[data.char] = kvgStrokes;
                    // Only redraw if still on same character
                    if (getCurrentChar().char === data.char) {
                        drawGuide();
                    }
                }
            });
        }
    }

    // =========================================================================
    // MAIN DRAWING CANVAS
    // =========================================================================
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    let canvasRect = null;

    function resizeCanvas() {
        const container = document.getElementById('canvasContainer');
        const rect = container.getBoundingClientRect();
        const size = Math.floor(rect.width);
        const oldSize = drawCanvas.width;
        drawCanvas.width = size;
        drawCanvas.height = size;
        drawCanvas.style.width = size + 'px';
        drawCanvas.style.height = size + 'px';
        canvasRect = drawCanvas.getBoundingClientRect();
        // keep already-drawn strokes aligned with the rescaled guide, or a
        // rotation mid-drawing would unfairly fail a correct trace
        if (oldSize > 0 && oldSize !== size) {
            const ratio = size / oldSize;
            const scalePt = p => { p.x *= ratio; p.y *= ratio; };
            userStrokes.forEach(st => st.forEach(scalePt));
            if (currentStroke) currentStroke.forEach(scalePt);
        }
        redrawCanvas();
    }

    function redrawCanvas() {
        const w = drawCanvas.width;
        const h = drawCanvas.height;
        drawCtx.clearRect(0, 0, w, h);

        // Draw guide strokes
        drawGuideOnMain();

        // Redraw user strokes (rainbow ink is display-only - scoring never sees the color)
        userStrokes.forEach((stroke, i) => {
            drawStrokePath(stroke, rainbowInk ? 'hsl(' + (i * 40) + ',70%,45%)' : '#37474f', 4);
        });

        // Draw current stroke
        if (currentStroke && currentStroke.length > 0) {
            drawStrokePath(currentStroke, rainbowInk ? 'hsl(' + (userStrokes.length * 40) + ',70%,45%)' : '#37474f', 4);
        }

        updateStrokeCounter();
    }

    // Cache for KanjiVG guide data on main canvas
    let guideKvgMainCache = {};

    function drawGuideOnMain() {
        const w = drawCanvas.width;
        const h = drawCanvas.height;
        const data = getCurrentChar();
        const pad = w * 0.08;
        const area = w - pad * 2;

        // Draw KanjiVG paths as dashed guide lines if cached
        if (guideKvgMainCache[data.char]) {
            const kvgStrokes = guideKvgMainCache[data.char];
            drawCtx.save();
            drawCtx.globalAlpha = 0.35;
            drawCtx.strokeStyle = '#90a4ae';
            drawCtx.lineWidth = Math.max(4, w * 0.014);
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.setLineDash([8, 5]);
            kvgStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                drawCtx.beginPath();
                drawCtx.moveTo(pad + stroke[0].x * area / 109, pad + stroke[0].y * area / 109);
                for (let j = 1; j < stroke.length; j++) {
                    drawCtx.lineTo(pad + stroke[j].x * area / 109, pad + stroke[j].y * area / 109);
                }
                drawCtx.stroke();
            });
            drawCtx.setLineDash([]);
            drawCtx.restore();

            // Draw stroke order numbers at start of each KanjiVG stroke
            kvgStrokes.forEach((stroke, i) => {
                if (stroke.length === 0) return;
                const sx = pad + stroke[0].x * area / 109;
                const sy = pad + stroke[0].y * area / 109;
                const r = Math.max(12, w * 0.035);

                drawCtx.fillStyle = 'rgba(233, 30, 99, 0.7)';
                drawCtx.beginPath();
                drawCtx.arc(sx, sy, r, 0, Math.PI * 2);
                drawCtx.fill();
                drawCtx.fillStyle = 'white';
                drawCtx.font = 'bold ' + Math.max(10, w * 0.03) + 'px Nunito, sans-serif';
                drawCtx.textAlign = 'center';
                drawCtx.textBaseline = 'middle';
                drawCtx.fillText('' + (i + 1), sx, sy);
            });
        } else {
            // Fallback: use local path data for stroke numbers while KanjiVG loads
            data.paths.forEach((stroke, i) => {
                const pts = stroke.points;
                const sx = pad + pts[0][0] * area;
                const sy = pad + pts[0][1] * area;
                const r = Math.max(12, w * 0.035);

                drawCtx.fillStyle = 'rgba(233, 30, 99, 0.7)';
                drawCtx.beginPath();
                drawCtx.arc(sx, sy, r, 0, Math.PI * 2);
                drawCtx.fill();
                drawCtx.fillStyle = 'white';
                drawCtx.font = 'bold ' + Math.max(10, w * 0.03) + 'px Nunito, sans-serif';
                drawCtx.textAlign = 'center';
                drawCtx.textBaseline = 'middle';
                drawCtx.fillText('' + (i + 1), sx, sy);
            });

            // Trigger async fetch and redraw when ready
            getKvgPaths(data.char).then(kvgStrokes => {
                if (kvgStrokes && kvgStrokes.length > 0) {
                    guideKvgMainCache[data.char] = kvgStrokes;
                    // Only redraw if still on the same character
                    if (getCurrentChar().char === data.char) {
                        redrawCanvas();
                    }
                }
            });
        }
    }

    function drawStrokePath(points, color, width) {
        if (points.length === 0) return;
        if (points.length < 2) {
            // A tap - render as a dot so the stroke is visible
            drawCtx.fillStyle = color;
            drawCtx.beginPath();
            drawCtx.arc(points[0].x, points[0].y, width, 0, Math.PI * 2);
            drawCtx.fill();
            return;
        }
        drawCtx.strokeStyle = color;
        drawCtx.lineWidth = width;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.setLineDash([]);
        drawCtx.beginPath();
        drawCtx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            drawCtx.lineTo(points[i].x, points[i].y);
        }
        drawCtx.stroke();
    }

    function updateStrokeCounter() {
        const count = userStrokes.length + (currentStroke ? 1 : 0);
        const data = getCurrentChar();
        // KanjiVG (one path per stroke) is the authority on stroke count,
        // so the counter always agrees with what Check expects
        const kvg = kvgCache[data.char];
        const expected = (kvg && kvg.length > 0) ? kvg.length : data.strokes;
        document.getElementById('strokeCounter').textContent = 'Strokes: ' + count + ' / ' + expected;
    }

    // =========================================================================
    // TOUCH / MOUSE INPUT
    // =========================================================================
    // Find the finger that started the stroke in a TouchList (null if absent)
    function findTrackedTouch(list) {
        if (!list || activeTouchId === null) return null;
        for (let i = 0; i < list.length; i++) {
            if (list[i].identifier === activeTouchId) return list[i];
        }
        return null;
    }

    function getPos(e) {
        canvasRect = drawCanvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            // Follow the finger that started the stroke, not whichever touch is first
            const t = findTrackedTouch(e.touches) || e.touches[0];
            clientX = t.clientX;
            clientY = t.clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        // Scale to canvas internal coordinates
        const scaleX = drawCanvas.width / canvasRect.width;
        const scaleY = drawCanvas.height / canvasRect.height;
        return {
            x: (clientX - canvasRect.left) * scaleX,
            y: (clientY - canvasRect.top) * scaleY
        };
    }

    function startStroke(e) {
        if (showingAnimation) return;
        e.preventDefault();
        // A second finger (or a resting palm) must not restart the stroke
        if (isDrawing) return;
        activeTouchId = (e.changedTouches && e.changedTouches.length > 0)
            ? e.changedTouches[0].identifier
            : null;
        isDrawing = true;
        const pos = getPos(e);
        currentStroke = [pos];
    }

    function moveStroke(e) {
        if (!isDrawing || !currentStroke || showingAnimation) return;
        e.preventDefault();
        // Ignore moves from fingers other than the one drawing
        if (activeTouchId !== null && !findTrackedTouch(e.changedTouches)) return;
        const pos = getPos(e);
        currentStroke.push(pos);
        redrawCanvas();
    }

    function endStroke(e) {
        if (!isDrawing || !currentStroke || showingAnimation) return;
        e.preventDefault();
        // Only lifting the finger that started the stroke ends it
        if (activeTouchId !== null && !findTrackedTouch(e.changedTouches)) return;
        activeTouchId = null;
        isDrawing = false;
        // Keep even 1-2 point strokes: quick taps are real "dot" strokes
        // in characters like ふ - discarding them broke the stroke count.
        if (currentStroke.length >= 1) {
            scored = false; // the drawing changed - it may be graded again
            userStrokes.push(currentStroke);
        }
        currentStroke = null;
        redrawCanvas();
    }

    // Touch events
    drawCanvas.addEventListener('touchstart', startStroke, { passive: false });
    drawCanvas.addEventListener('touchmove', moveStroke, { passive: false });
    drawCanvas.addEventListener('touchend', endStroke, { passive: false });
    drawCanvas.addEventListener('touchcancel', endStroke, { passive: false });

    // Mouse events
    drawCanvas.addEventListener('mousedown', startStroke);
    drawCanvas.addEventListener('mousemove', moveStroke);
    drawCanvas.addEventListener('mouseup', endStroke);
    drawCanvas.addEventListener('mouseleave', endStroke);

    // Prevent scrolling while drawing on canvas
    document.getElementById('canvasContainer').addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

    // =========================================================================
    // ACTIONS
    // =========================================================================
    function clearCanvas() {
        userStrokes = [];
        currentStroke = null;
        isDrawing = false;
        activeTouchId = null;
        scored = false;
        showingAnimation = false;
        animGen++; // cancel any Show Me animation still running
        guidePixelCache = { char: null, mask: null, w: 0 };
        redrawCanvas();
        hideFeedback();
    }

    function nextChar() {
        const dataArr = getCurrentData();
        currentIndex = (currentIndex + 1) % dataArr.length;
        clearCanvas();
        updateUI();
    }

    function prevChar() {
        const dataArr = getCurrentData();
        currentIndex = (currentIndex - 1 + dataArr.length) % dataArr.length;
        clearCanvas();
        updateUI();
    }

    // =========================================================================
    // STROKE ANALYSIS & FEEDBACK
    // =========================================================================
    function analyzeStrokeDirection(points) {
        if (points.length < 2) return 'dot';
        const first = points[0];
        const last = points[points.length - 1];
        const dx = last.x - first.x;
        const dy = last.y - first.y;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        // Determine primary direction
        if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return 'dot';

        if (angle >= -45 && angle < 45) return 'right';
        if (angle >= 45 && angle < 135) return 'down';
        if (angle >= 135 || angle < -135) return 'left';
        if (angle >= -135 && angle < -45) return 'up';
        return 'unknown';
    }

    function getExpectedDirection(dir) {
        // Map our path directions to expected primary directions
        const map = {
            'right': ['right', 'down'],
            'left': ['left'],
            'down': ['down', 'down-left', 'down-right'],
            'down-left': ['down', 'down-left', 'left'],
            'down-right': ['down', 'down-right', 'right'],
            'up': ['up'],
            'curve-right': ['right', 'down', 'down-right'],
            'curve-left': ['right', 'down', 'left', 'down-left'],
            'hook-right': ['down', 'right'],
            'hook-left': ['down', 'left'],
            'loop': ['right', 'down', 'left', 'down-left', 'down-right'],
            'up-curve': ['up', 'right']
        };
        return map[dir] || ['right', 'down', 'left', 'up'];
    }

    // Render the character onto a hidden canvas and get its pixel mask
    let guidePixelCache = { char: null, mask: null, w: 0 };

    function getGuidePixelMask(canvasW) {
        const data = getCurrentChar();
        if (guidePixelCache.char === data.char && guidePixelCache.w === canvasW) {
            return guidePixelCache.mask;
        }

        const offscreen = document.createElement('canvas');
        offscreen.width = canvasW;
        offscreen.height = canvasW;
        const ctx = offscreen.getContext('2d');
        const pad = canvasW * 0.08;
        const area = canvasW - pad * 2;

        ctx.fillStyle = '#000000';
        ctx.font = 'bold ' + Math.floor(area * 0.88) + 'px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(data.char, canvasW / 2, canvasW / 2 + area * 0.03);

        const imageData = ctx.getImageData(0, 0, canvasW, canvasW);
        const mask = imageData.data; // RGBA array
        guidePixelCache = { char: data.char, mask, w: canvasW };
        return mask;
    }

    // Check if a pixel coordinate is on or near the font-rendered character
    function isNearCharacter(x, y, mask, w, tolerance) {
        // Check a square area around (x,y) within tolerance
        const ix = Math.round(x);
        const iy = Math.round(y);
        for (let dy = -tolerance; dy <= tolerance; dy++) {
            for (let dx = -tolerance; dx <= tolerance; dx++) {
                const px = ix + dx;
                const py = iy + dy;
                if (px >= 0 && px < w && py >= 0 && py < w) {
                    const idx = (py * w + px) * 4;
                    if (mask[idx + 3] > 30) return true; // alpha > 30 means part of the character
                }
            }
        }
        return false;
    }

    // Score how well user strokes match the character
    // Two-way check: (1) are user points on the character? (2) does the user cover the character's extent?
    function fontProximityScore(canvasW) {
        const mask = getGuidePixelMask(canvasW);
        const data = getCurrentChar();
        const tolerance = Math.max(10, Math.floor(canvasW * 0.06)); // 6% for all characters

        // SCORE 1: What % of user points are near the character?
        let onChar = 0;
        let totalSampled = 0;

        userStrokes.forEach(stroke => {
            const step = Math.max(1, Math.floor(stroke.length / 40));
            for (let i = 0; i < stroke.length; i += step) {
                totalSampled++;
                if (isNearCharacter(stroke[i].x, stroke[i].y, mask, canvasW, tolerance)) {
                    onChar++;
                }
            }
        });

        if (totalSampled === 0) return 0;
        const precisionScore = onChar / totalSampled;

        // SCORE 2: Coverage check - does the user drawing span the character's area?
        // Find the bounding box of the actual character pixels
        let charMinX = canvasW, charMaxX = 0, charMinY = canvasW, charMaxY = 0;
        for (let y = 0; y < canvasW; y += 3) {
            for (let x = 0; x < canvasW; x += 3) {
                if (mask[(y * canvasW + x) * 4 + 3] > 30) {
                    if (x < charMinX) charMinX = x;
                    if (x > charMaxX) charMaxX = x;
                    if (y < charMinY) charMinY = y;
                    if (y > charMaxY) charMaxY = y;
                }
            }
        }

        // Find bounding box of user strokes
        let userMinX = canvasW, userMaxX = 0, userMinY = canvasW, userMaxY = 0;
        userStrokes.forEach(stroke => {
            stroke.forEach(pt => {
                if (pt.x < userMinX) userMinX = pt.x;
                if (pt.x > userMaxX) userMaxX = pt.x;
                if (pt.y < userMinY) userMinY = pt.y;
                if (pt.y > userMaxY) userMaxY = pt.y;
            });
        });

        // How much of the character's width and height does the user cover?
        const charW = Math.max(1, charMaxX - charMinX);
        const charH = Math.max(1, charMaxY - charMinY);
        const overlapX = Math.max(0, Math.min(userMaxX, charMaxX) - Math.max(userMinX, charMinX));
        const overlapY = Math.max(0, Math.min(userMaxY, charMaxY) - Math.max(userMinY, charMinY));
        const coverageX = overlapX / charW;
        const coverageY = overlapY / charH;
        const coverageScore = Math.min(coverageX, coverageY);

        // Combined: both precision AND coverage must be good
        // This prevents "67" from passing on 二 because "67" wouldn't cover
        // the right area, and many points would be off-character
        return precisionScore * 0.7 + Math.min(coverageScore, 1.0) * 0.3;
    }

    // =========================================================================
    // KANJIVG PER-STROKE SCORING
    // The on-screen guide is drawn from KanjiVG strokes, so accuracy is judged
    // against those same strokes. (The old scorer compared against a
    // font-rendered glyph, which has different proportions than the guide -
    // a perfect trace of the guide could still score badly.)
    // =========================================================================

    // Resample a polyline to n points evenly spaced along its length
    function resamplePoints(pts, n) {
        if (pts.length === 0) return [];
        if (pts.length === 1) return Array.from({length: n}, () => ({x: pts[0].x, y: pts[0].y}));
        const dists = [0];
        let total = 0;
        for (let i = 1; i < pts.length; i++) {
            total += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y);
            dists.push(total);
        }
        if (total === 0) return Array.from({length: n}, () => ({x: pts[0].x, y: pts[0].y}));
        const out = [];
        let seg = 0;
        for (let s = 0; s < n; s++) {
            const target = total * s / (n - 1);
            while (seg < pts.length - 2 && dists[seg + 1] < target) seg++;
            const span = dists[seg + 1] - dists[seg];
            const t = span > 0 ? (target - dists[seg]) / span : 0;
            out.push({
                x: pts[seg].x + (pts[seg+1].x - pts[seg].x) * t,
                y: pts[seg].y + (pts[seg+1].y - pts[seg].y) * t
            });
        }
        return out;
    }

    function meanMinDist(a, b) {
        let sum = 0;
        for (let i = 0; i < a.length; i++) {
            let best = Infinity;
            for (let j = 0; j < b.length; j++) {
                const dx = a[i].x - b[j].x, dy = a[i].y - b[j].y;
                const d = dx * dx + dy * dy;
                if (d < best) best = d;
            }
            sum += Math.sqrt(best);
        }
        return sum / a.length;
    }

    // Compare one user stroke against one guide stroke.
    // Two-way distance: "stray" = how far the drawing wanders off the stroke,
    // "missed" = how much of the stroke was never covered. Either one being
    // large means a bad trace, so the worse of the two drives the score.
    function strokeMatchScore(userStroke, guideStroke, w) {
        const u = resamplePoints(userStroke, 24);
        const g = resamplePoints(guideStroke, 24);
        const stray = meanMinDist(u, g);
        const missed = meanMinDist(g, u);

        // Endpoint distances, both orientations (also powers the backwards check)
        const gEnd = g[g.length - 1], uEnd = u[u.length - 1];
        const forward = Math.hypot(u[0].x - g[0].x, u[0].y - g[0].y) + Math.hypot(uEnd.x - gEnd.x, uEnd.y - gEnd.y);
        const reversed = Math.hypot(u[0].x - gEnd.x, u[0].y - gEnd.y) + Math.hypot(uEnd.x - g[0].x, uEnd.y - g[0].y);
        // Endpoint term catches half-drawn strokes that mean distance is too
        // forgiving about (half of 一 still averaged a passing score without it)
        const endDist = Math.min(forward, reversed) / 2;

        const d = Math.max(stray, missed, endDist);
        const free = w * 0.05;   // this close counts as perfect (kid-sized wobble)
        const range = w * 0.20;  // score fades to 0 across this distance
        const score = Math.max(0, Math.min(1, 1 - Math.max(0, d - free) / range));

        const backwards = reversed + w * 0.04 < forward;

        return { score: score, backwards: backwards };
    }

    async function checkDrawing() {
        const data = getCurrentChar();
        const w = drawCanvas.width;

        if (userStrokes.length === 0) {
            streak = 0;
            showFeedback('Draw the character first!', 'tryagain');
            playSfx('wrong');
            return;
        }

        // A passing drawing can only be graded once (re-tapping Check or holding
        // Enter must not inflate the streak or replay stars/speech)
        if (scored) return;

        // Judge against the same KanjiVG strokes the guide displays.
        // KanjiVG is also the authority on stroke count (one path per stroke).
        const kvgRaw = await getKvgPaths(data.char);
        const guide = (kvgRaw && kvgRaw.length > 0) ? scaleKvgToCanvas(kvgRaw, w) : null;
        const expectedCount = guide ? guide.length : data.strokes;
        const userCount = userStrokes.length;

        if (userCount !== expectedCount) {
            streak = 0;
            if (userCount < expectedCount) {
                showFeedback('Need ' + expectedCount + ' strokes - you drew ' + userCount + '!', 'wrong');
            } else {
                showFeedback('Too many strokes! ' + data.char + ' has ' + expectedCount + '.', 'wrong');
            }
            playSfx('wrong');
            return;
        }

        if (!guide) {
            // KanjiVG unavailable (offline) - fall back to the font-mask check
            checkDrawingFallback(data, w);
            return;
        }

        // Score stroke i of the drawing against stroke i of the guide
        const results = userStrokes.map((s, i) => strokeMatchScore(s, guide[i], w));
        const avg = results.reduce((sum, r) => sum + r.score, 0) / results.length;
        const backwardsCount = results.filter(r => r.backwards).length;
        const pct = Math.round(avg * 100);

        // If strokes fit much better in some other order, it's an order problem
        let orderSwapped = false;
        if (avg < 0.55 && expectedCount > 1) {
            let bestSum = 0;
            for (let i = 0; i < userStrokes.length; i++) {
                let best = 0;
                for (let j = 0; j < guide.length; j++) {
                    const sc = strokeMatchScore(userStrokes[i], guide[j], w).score;
                    if (sc > best) best = sc;
                }
                bestSum += best;
            }
            orderSwapped = (bestSum / userStrokes.length) > avg + 0.2;
        }

        if (avg >= 0.55 && backwardsCount <= expectedCount / 2) {
            scored = true;
            streak++;
            // Speak the character on success
            setTimeout(() => speakCurrentChar(), 400);
            const wasNewChar = !(currentMode.startsWith('kanji') ? practicedKanji
                : currentMode === 'katakana' ? practicedKatakana : practiced).has(data.char);
            if (currentMode.startsWith('kanji')) {
                practicedKanji.add(data.char);
            } else if (currentMode === 'katakana') {
                practicedKatakana.add(data.char);
            } else {
                practiced.add(data.char);
            }
            savePracticed();
            buildCharGrid();
            updateProgress();
            spawnStars(Math.min(8 + streak * 4, 24));
            if (!(wasNewChar && celebrateIfRowComplete(data))) {
                let msg = 'Great job! (' + pct + '% accuracy)';
                if (streak >= 2) msg += ' 🔥 ' + streak + ' in a row!';
                showFeedback(msg, 'great');
                playSfx('correct');
                if (streak >= 3) piyoSay('streak');
            }
        } else if (avg >= 0.55) {
            streak = 0;
            showFeedback('Good shape! Start each stroke at its ① dot!', 'tryagain');
            playSfx('wrong');
        } else if (orderSwapped) {
            streak = 0;
            showFeedback('Right lines - check the stroke order! (' + pct + '%)', 'tryagain');
            playSfx('wrong');
        } else if (avg >= 0.35) {
            streak = 0;
            let worst = 0;
            for (let i = 1; i < results.length; i++) {
                if (results[i].score < results[worst].score) worst = i;
            }
            showFeedback('Almost! ' + pct + '% - stroke ' + (worst + 1) + ' needs the most work!', 'tryagain');
            playSfx('wrong');
        } else {
            streak = 0;
            showFeedback('Try to trace over the dashed guide! (' + pct + '%)', 'tryagain');
            playSfx('wrong');
        }
    }

    // Old font-mask scoring, kept only for when KanjiVG can't be fetched
    function checkDrawingFallback(data, w) {
        const expectedCount = data.strokes;
        const userCount = userStrokes.length;

        const pixelScore = fontProximityScore(w);

        let directionScore = 0;
        for (let i = 0; i < Math.min(userCount, data.paths.length); i++) {
            const userDir = analyzeStrokeDirection(userStrokes[i]);
            const expected = getExpectedDirection(data.paths[i].dir);
            if (expected.includes(userDir) || userDir === 'dot') {
                directionScore++;
            }
        }
        const dirPct = directionScore / expectedCount;

        if (pixelScore >= 0.45 && dirPct >= 0.4) {
            scored = true;
            streak++;
            setTimeout(() => speakCurrentChar(), 400);
            const wasNewChar = !(currentMode.startsWith('kanji') ? practicedKanji
                : currentMode === 'katakana' ? practicedKatakana : practiced).has(data.char);
            if (currentMode.startsWith('kanji')) {
                practicedKanji.add(data.char);
            } else if (currentMode === 'katakana') {
                practicedKatakana.add(data.char);
            } else {
                practiced.add(data.char);
            }
            savePracticed();
            buildCharGrid();
            updateProgress();
            spawnStars(Math.min(8 + streak * 4, 24));
            if (!(wasNewChar && celebrateIfRowComplete(data))) {
                let msg = 'Great job! (' + Math.round(pixelScore * 100) + '% accuracy)';
                if (streak >= 2) msg += ' 🔥 ' + streak + ' in a row!';
                showFeedback(msg, 'great');
                playSfx('correct');
                if (streak >= 3) piyoSay('streak');
            }
        } else if (pixelScore >= 0.3) {
            streak = 0;
            showFeedback('Almost! ' + Math.round(pixelScore * 100) + '% - trace closer to the guide!', 'tryagain');
            playSfx('wrong');
        } else if (dirPct < 0.4) {
            streak = 0;
            showFeedback('Check the stroke order! (' + Math.round(pixelScore * 100) + '%)', 'tryagain');
            playSfx('wrong');
        } else {
            streak = 0;
            showFeedback('Try to trace over the character! (' + Math.round(pixelScore * 100) + '%)', 'tryagain');
            playSfx('wrong');
        }
    }

        el.className = 'feedback-msg ' + type;

            localStorage.setItem('fiona-katakana-progress', JSON.stringify([...practicedKatakana]));
            localStorage.setItem('yuna-kanji-progress', JSON.stringify([...practicedKanji]));

    // =========================================================================

    const celebratedRows = new Set(); // fanfare fires once per row per session

    function celebrateIfRowComplete(data) {
        const rowKey = currentMode + ':' + data.row;
        if (celebratedRows.has(rowKey)) return false;

        let practicedSet, names;
        if (currentMode.startsWith('kanji')) {
            practicedSet = practicedKanji;
            names = kanjiRowNames;
        } else if (currentMode === 'katakana') {
            practicedSet = practicedKatakana;
            names = katakanaRowNames;
        } else {
            practicedSet = practiced;
            names = rowNames;
        }

        const rowChars = getCurrentData().filter(k => k.row === data.row);
        if (!rowChars.every(k => practicedSet.has(k.char))) return false;

        celebratedRows.add(rowKey);
        showFeedback('You finished the whole ' + names[data.row] + '! \ud83c\udf08', 'great');
        playSfx('fanfare');
        piyoSay('row');
        piyoWiggle();
        rainbowInk = true; // display-only: Check scoring never looks at ink color
        redrawCanvas();
        return true;
