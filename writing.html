<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fiona's Writing">
    <title>Fiona's Hiragana Writing Practice</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Nunito', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #e8eaf6 30%, #e0f7fa 60%, #fff3e0 100%);
            min-height: 100vh;
            background-attachment: fixed;
            overflow-x: hidden;
            padding: 0 0 40px 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 183, 197, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(179, 229, 252, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 245, 157, 0.2) 0%, transparent 50%);
            z-index: 0;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 18px 20px 14px;
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 1.6em;
            font-weight: 800;
            background: linear-gradient(135deg, #e91e63, #9c27b0, #3f51b5, #00bcd4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header-links {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 6px;
        }

        .header-links a {
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .header-links a:active {
            transform: scale(0.95);
        }

        .back-link {
            background: linear-gradient(135deg, #fff9c4, #ffe0b2);
            color: #f57f17;
        }

        .workbook-link {
            background: linear-gradient(135deg, #f8bbd0, #f48fb1);
            color: #880e4f;
        }

        /* Main layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        /* Progress bar */
        .progress-section {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .progress-label {
            font-size: 0.85em;
            font-weight: 700;
            color: #78909c;
            margin-bottom: 6px;
        }

        .progress-bar-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.06);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ce93d8, #64b5f6, #4db6ac);
            border-radius: 5px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-count {
            font-size: 0.8em;
            font-weight: 700;
            color: #b0bec5;
            margin-top: 4px;
            text-align: right;
        }

        /* Character grid */
        .char-grid-section {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .char-grid-section h3 {
            font-size: 0.85em;
            font-weight: 700;
            color: #78909c;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .char-row-label {
            font-size: 0.85em;
            font-weight: 800;
            color: #90a4ae;
            margin-top: 12px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .char-row-label:first-child {
            margin-top: 0;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .char-btn {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid transparent;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1.6em;
            font-weight: 700;
            color: #546e7a;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .char-btn:active {
            transform: scale(0.92);
        }

        .char-btn.active {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: white;
            border-color: #ab47bc;
            box-shadow: 0 3px 12px rgba(171, 71, 188, 0.3);
        }

        .char-btn.practiced {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            color: #2e7d32;
        }

        .char-btn.practiced.active {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: white;
        }

        .char-btn .check-mark {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 14px;
            height: 14px;
            background: #43a047;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.45em;
            color: white;
            font-weight: 800;
        }

        /* Practice area */
        .practice-area {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        /* Reference panel */
        .reference-panel {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            flex: 0 0 160px;
            min-width: 140px;
        }

        .ref-char {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 120px;
            font-weight: 700;
            line-height: 1.1;
            color: #37474f;
            position: relative;
            display: inline-block;
        }

        .ref-romaji {
            font-size: 1.1em;
            font-weight: 700;
            color: #78909c;
            margin-top: 2px;
        }

        .ref-strokes {
            font-size: 0.85em;
            font-weight: 700;
            color: #b0bec5;
            margin-top: 4px;
        }

        .ref-stroke-order {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px dashed rgba(0,0,0,0.08);
        }

        .ref-stroke-order canvas {
            border-radius: 12px;
            background: #fafafa;
        }

        /* Canvas area */
        .canvas-wrapper {
            flex: 1;
            min-width: 280px;
        }

        .drawing-canvas-container {
            position: relative;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 3px solid rgba(206, 147, 216, 0.3);
            aspect-ratio: 1 / 1;
            max-width: 400px;
            width: 100%;
        }

        .drawing-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Grid lines on canvas */
        .canvas-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .canvas-grid::before,
        .canvas-grid::after {
            content: '';
            position: absolute;
            background: rgba(206, 147, 216, 0.15);
        }

        .canvas-grid::before {
            left: 50%;
            top: 10%;
            width: 1px;
            height: 80%;
            border-left: 1px dashed rgba(206, 147, 216, 0.3);
        }

        .canvas-grid::after {
            top: 50%;
            left: 10%;
            height: 1px;
            width: 80%;
            border-top: 1px dashed rgba(206, 147, 216, 0.3);
        }

        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            color: white;
            min-width: 80px;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .btn-clear {
            background: linear-gradient(135deg, #ffab91, #ff8a65);
        }

        .btn-show {
            background: linear-gradient(135deg, #90caf9, #64b5f6);
        }

        .btn-check {
            background: linear-gradient(135deg, #a5d6a7, #66bb6a);
        }

        .btn-next {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
        }

        .btn-prev {
            background: linear-gradient(135deg, #b0bec5, #90a4ae);
        }

        /* Feedback message */
        .feedback {
            text-align: center;
            margin-top: 12px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-msg {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 22px;
            font-weight: 800;
            font-size: 1.05em;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.3s ease;
        }

        .feedback-msg.show {
            opacity: 1;
            transform: scale(1);
        }

        .feedback-msg.great {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            color: #2e7d32;
        }

        .feedback-msg.tryagain {
            background: linear-gradient(135deg, #fff9c4, #fff176);
            color: #f57f17;
        }

        .feedback-msg.wrong {
            background: linear-gradient(135deg, #ffcdd2, #ef9a9a);
            color: #c62828;
        }

        /* Stroke counter overlay */
        .stroke-counter {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 0.8em;
            font-weight: 700;
            color: #78909c;
            z-index: 5;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header h1 {
                font-size: 1.3em;
            }

            .practice-area {
                flex-direction: column;
                align-items: center;
            }

            .reference-panel {
                flex: none;
                width: 100%;
                display: flex;
                align-items: center;
                gap: 14px;
                text-align: left;
                padding: 12px 16px;
            }

            .ref-char {
                font-size: 80px;
                flex-shrink: 0;
            }

            .ref-info {
                flex: 1;
            }

            .ref-stroke-order {
                border-top: none;
                margin-top: 0;
                padding-top: 0;
            }

            .canvas-wrapper {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .drawing-canvas-container {
                max-width: 360px;
            }

            .char-btn {
                width: 36px;
                height: 36px;
                font-size: 1.05em;
            }

            .container {
                padding: 10px;
            }
        }

        @media (min-width: 641px) {
            .reference-panel {
                position: sticky;
                top: 100px;
            }
        }

        /* Animation for feedback */
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .feedback-msg.show {
            animation: bounceIn 0.4s ease forwards;
        }

        /* Stars animation for correct answer */
        @keyframes starFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(0.5); opacity: 0; }
        }

        .star-particle {
            position: absolute;
            font-size: 1.4em;
            pointer-events: none;
            animation: starFloat 1s ease forwards;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Fiona's Hiragana Writing Practice</h1>
        <div class="header-links">
            <a href="index.html" class="back-link">Back to Flashcards</a>
            <a href="ebook.html" class="workbook-link">Workbook</a>
        </div>
    </div>

    <div class="container">
        <!-- Practice Area FIRST -->
        <div class="practice-area">
            <!-- Reference -->
            <div class="reference-panel">
                <div class="ref-char" id="refChar">あ</div>
                <div class="ref-info">
                    <div class="ref-romaji" id="refRomaji">a</div>
                    <div class="ref-strokes" id="refStrokes">3 strokes</div>
                    <div class="ref-stroke-order">
                        <canvas id="guideCanvas" width="120" height="120"></canvas>
                    </div>
                </div>
            </div>

            <!-- Drawing -->
            <div class="canvas-wrapper">
                <div class="drawing-canvas-container" id="canvasContainer">
                    <canvas id="drawCanvas"></canvas>
                    <div class="canvas-grid"></div>
                    <div class="stroke-counter" id="strokeCounter">Strokes: 0</div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn btn-clear" onclick="clearCanvas()">Clear</button>
                    <button class="action-btn btn-show" onclick="showMe()">Show Me</button>
                    <button class="action-btn btn-check" onclick="checkDrawing()">Check</button>
                    <button class="action-btn btn-prev" onclick="prevChar()">Prev</button>
                    <button class="action-btn btn-next" onclick="nextChar()">Next</button>
                </div>
                <div class="feedback">
                    <div class="feedback-msg" id="feedbackMsg"></div>
                </div>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-section">
            <div class="progress-label">Your Progress</div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-count" id="progressCount">0 / 46 practiced</div>
        </div>

        <!-- Character Grid BELOW with more space -->
        <div class="char-grid-section">
            <h3>Choose a character to practice:</h3>
            <div id="charGridContainer"></div>
        </div>
    </div>

    <script>
    // =========================================================================
    // HIRAGANA DATA - All 46 basic characters with stroke data
    // =========================================================================
    // Each character: { char, romaji, strokes: count, row, paths: array of stroke path data }
    // Each path: { points: [[x,y],...], dir: direction }
    // Coordinates are normalized 0-1 within the character cell
    // dir values: 'right','left','down','up','curve-right','curve-left','down-right',
    //             'down-left','up-curve','loop','hook-left','hook-right'

    const hiraganaData = [
        // --- A row ---
        { char: 'あ', romaji: 'a', strokes: 3, row: 'a', paths: [
            // Stroke 1: horizontal stroke across upper area, slight curve
            { points: [[0.15,0.33],[0.22,0.31],[0.32,0.29],[0.42,0.28],[0.52,0.27],[0.62,0.27],[0.72,0.28],[0.82,0.30]], dir: 'right' },
            // Stroke 2: vertical from top-center, curving slightly left at bottom
            { points: [[0.52,0.12],[0.51,0.20],[0.50,0.28],[0.49,0.36],[0.48,0.44],[0.46,0.52],[0.44,0.60],[0.41,0.68],[0.38,0.74]], dir: 'down' },
            // Stroke 3: starts left of center, sweeps right, loops counterclockwise
            { points: [[0.20,0.52],[0.28,0.48],[0.38,0.45],[0.48,0.44],[0.58,0.45],[0.67,0.48],[0.73,0.54],[0.76,0.62],[0.74,0.70],[0.68,0.77],[0.58,0.82],[0.48,0.84],[0.38,0.82],[0.30,0.76],[0.26,0.68]], dir: 'loop' }
        ]},
        { char: 'い', romaji: 'i', strokes: 2, row: 'a', paths: [
            // Stroke 1: left stroke, slightly curving leftward as it descends
            { points: [[0.33,0.18],[0.32,0.26],[0.31,0.34],[0.30,0.42],[0.28,0.50],[0.26,0.58],[0.24,0.66],[0.22,0.72]], dir: 'down' },
            // Stroke 2: right stroke, slightly curving rightward as it descends
            { points: [[0.58,0.20],[0.59,0.28],[0.60,0.36],[0.61,0.44],[0.63,0.52],[0.65,0.60],[0.68,0.66],[0.72,0.72]], dir: 'down' }
        ]},
        { char: 'う', romaji: 'u', strokes: 2, row: 'a', paths: [
            // Stroke 1: short horizontal tick at top
            { points: [[0.40,0.18],[0.44,0.16],[0.48,0.15],[0.52,0.15],[0.56,0.16],[0.60,0.18]], dir: 'right' },
            // Stroke 2: open curve from upper-left, arcs right, then curves down and left
            { points: [[0.26,0.34],[0.34,0.32],[0.44,0.31],[0.54,0.31],[0.62,0.33],[0.68,0.38],[0.70,0.44],[0.70,0.52],[0.67,0.60],[0.62,0.67],[0.55,0.73],[0.46,0.77],[0.38,0.78],[0.30,0.74]], dir: 'curve-left' }
        ]},
        { char: 'え', romaji: 'e', strokes: 2, row: 'a', paths: [
            // Stroke 1: short horizontal stroke at top
            { points: [[0.30,0.22],[0.36,0.20],[0.42,0.19],[0.48,0.19],[0.54,0.20],[0.62,0.22]], dir: 'right' },
            // Stroke 2: descends left, then zigzags right, curving down-left at bottom
            { points: [[0.52,0.22],[0.48,0.28],[0.44,0.34],[0.38,0.40],[0.34,0.46],[0.38,0.50],[0.46,0.53],[0.54,0.56],[0.62,0.60],[0.67,0.66],[0.66,0.72],[0.60,0.78],[0.52,0.82],[0.42,0.84],[0.33,0.80]], dir: 'curve-left' }
        ]},
        { char: 'お', romaji: 'o', strokes: 3, row: 'a', paths: [
            // Stroke 1: horizontal across upper area
            { points: [[0.15,0.33],[0.24,0.30],[0.34,0.28],[0.44,0.27],[0.54,0.27],[0.64,0.28],[0.72,0.30],[0.80,0.33]], dir: 'right' },
            // Stroke 2: vertical from top, curving left at bottom
            { points: [[0.42,0.12],[0.42,0.20],[0.42,0.28],[0.42,0.36],[0.41,0.44],[0.40,0.52],[0.38,0.60],[0.35,0.68],[0.31,0.75],[0.27,0.82]], dir: 'down' },
            // Stroke 3: loop on right side
            { points: [[0.48,0.46],[0.55,0.47],[0.62,0.49],[0.69,0.53],[0.73,0.58],[0.75,0.65],[0.73,0.72],[0.68,0.78],[0.60,0.82],[0.52,0.83],[0.46,0.80],[0.43,0.74]], dir: 'loop' }
        ]},
        // --- KA row ---
        { char: 'か', romaji: 'ka', strokes: 3, row: 'ka', paths: [
            // Stroke 1: horizontal stroke across upper area
            { points: [[0.15,0.33],[0.24,0.30],[0.34,0.28],[0.44,0.27],[0.54,0.27],[0.64,0.28],[0.74,0.30],[0.83,0.33]], dir: 'right' },
            // Stroke 2: vertical from top through center, curving left at bottom
            { points: [[0.56,0.10],[0.55,0.18],[0.54,0.26],[0.52,0.34],[0.50,0.42],[0.47,0.50],[0.44,0.58],[0.40,0.66],[0.36,0.74],[0.32,0.82],[0.28,0.88]], dir: 'down-left' },
            // Stroke 3: short stroke on right, sweeping down
            { points: [[0.58,0.50],[0.61,0.54],[0.64,0.58],[0.67,0.63],[0.69,0.68],[0.71,0.74],[0.72,0.80],[0.71,0.86]], dir: 'down' }
        ]},
        { char: 'き', romaji: 'ki', strokes: 4, row: 'ka', paths: [
            // Stroke 1: upper horizontal
            { points: [[0.20,0.22],[0.28,0.20],[0.38,0.18],[0.48,0.18],[0.58,0.18],[0.68,0.20],[0.78,0.23]], dir: 'right' },
            // Stroke 2: lower horizontal
            { points: [[0.16,0.42],[0.26,0.40],[0.36,0.38],[0.46,0.38],[0.56,0.38],[0.66,0.39],[0.76,0.41],[0.84,0.44]], dir: 'right' },
            // Stroke 3: diagonal slanting down-left through both horizontals
            { points: [[0.64,0.10],[0.61,0.17],[0.58,0.24],[0.54,0.31],[0.50,0.38],[0.46,0.45],[0.42,0.52],[0.38,0.58]], dir: 'down-left' },
            // Stroke 4: bottom curved stroke
            { points: [[0.26,0.62],[0.34,0.60],[0.42,0.59],[0.52,0.60],[0.60,0.62],[0.65,0.66],[0.66,0.72],[0.63,0.78],[0.56,0.82],[0.46,0.84],[0.36,0.82],[0.28,0.78]], dir: 'curve-left' }
        ]},
        { char: 'く', romaji: 'ku', strokes: 1, row: 'ka', paths: [
            // Single stroke: V-shape, starts upper-right, angles down-left to center, then down-right
            { points: [[0.66,0.14],[0.62,0.20],[0.56,0.27],[0.50,0.34],[0.44,0.40],[0.38,0.46],[0.35,0.50],[0.38,0.55],[0.44,0.62],[0.50,0.68],[0.56,0.74],[0.62,0.80],[0.66,0.86]], dir: 'curve-right' }
        ]},

            { points: [[0.58,0.10],[0.56,0.16],[0.53,0.22],[0.50,0.28],[0.47,0.34],[0.44,0.40],[0.40,0.46]], dir: 'down-left' },
            // Stroke 3: curved stroke at bottom, sweeping right then down and left
            { points: [[0.18,0.52],[0.26,0.50],[0.36,0.49],[0.46,0.49],[0.54,0.50],[0.60,0.53],[0.64,0.58],[0.66,0.64],[0.64,0.70],[0.60,0.76],[0.54,0.80],[0.46,0.82],[0.38,0.82],[0.30,0.84]], dir: 'curve-left' }

            // Single stroke: starts upper-center, curves down-left, then hooks right and up
            { points: [[0.42,0.18],[0.40,0.24],[0.38,0.32],[0.35,0.40],[0.32,0.48],[0.28,0.56],[0.26,0.64],[0.28,0.70],[0.34,0.74],[0.42,0.76],[0.52,0.74],[0.60,0.68],[0.66,0.60],[0.70,0.50],[0.72,0.40]], dir: 'hook-right' }
        ]}
    ];

    // Row names for the grid
    const rowNames = {
        'a': 'A row (あ)',
        'ka': 'KA row (か)',
        'sa': 'SA row (さ)',
        'ta': 'TA row (た)',
        'na': 'NA row (な)',
        'ha': 'HA row (は)',
        'ma': 'MA row (ま)',
        'ya': 'YA row (や)',
        'ra': 'RA row (ら)',
        'wa': 'WA row (わ)'
    };

    // State
    let currentIndex = 0;
    let practiced = new Set();
    let userStrokes = []; // Array of strokes, each stroke = array of {x,y} points
    let currentStroke = null;
    let isDrawing = false;
    let showingAnimation = false;

    // Load progress from localStorage
    try {
        const saved = localStorage.getItem('fiona-writing-progress');
        if (saved) practiced = new Set(JSON.parse(saved));
    } catch(e) {}

    // =========================================================================
    // BUILD CHARACTER GRID
    // =========================================================================
    function buildCharGrid() {
        const container = document.getElementById('charGridContainer');
        container.innerHTML = '';
        const rowOrder = ['a','ka','sa','ta','na','ha','ma','ya','ra','wa'];

        rowOrder.forEach(row => {
            const label = document.createElement('div');
            label.className = 'char-row-label';
            label.textContent = rowNames[row];
            container.appendChild(label);

            const grid = document.createElement('div');
            grid.className = 'char-grid';

            hiraganaData.forEach((h, idx) => {
                if (h.row !== row) return;
                const btn = document.createElement('button');
                btn.className = 'char-btn';
                btn.textContent = h.char;
                btn.dataset.index = idx;

                if (practiced.has(h.char)) {
                    btn.classList.add('practiced');
                    const check = document.createElement('span');
                    check.className = 'check-mark';
                    check.textContent = '\u2713';
                    btn.appendChild(check);
                }

                if (idx === currentIndex) btn.classList.add('active');

                btn.addEventListener('click', () => {
                    selectChar(idx);
                });

                grid.appendChild(btn);
            });

            container.appendChild(grid);
        });
    }

    function selectChar(idx) {
        currentIndex = idx;
        clearCanvas();
        updateUI();
        hideFeedback();
    }

    function updateUI() {
        const h = hiraganaData[currentIndex];

        // Update reference
        document.getElementById('refChar').textContent = h.char;
        document.getElementById('refRomaji').textContent = h.romaji;
        document.getElementById('refStrokes').textContent = h.strokes + (h.strokes === 1 ? ' stroke' : ' strokes');

        // Update grid highlights
        document.querySelectorAll('.char-btn').forEach(btn => {
            btn.classList.remove('active');
            if (parseInt(btn.dataset.index) === currentIndex) {
                btn.classList.add('active');
            }
        });

        // Draw guide
        drawGuide();

        // Update progress
        updateProgress();

        // Draw guide strokes on main canvas
        drawGuideOnMain();
    }

    function updateProgress() {
        const total = hiraganaData.length;
        const done = practiced.size;
        const pct = (done / total) * 100;
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressCount').textContent = done + ' / ' + total + ' practiced';
    }

    // =========================================================================
    // GUIDE CANVAS (small reference)
    // =========================================================================
    function drawGuide() {
        const canvas = document.getElementById('guideCanvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h_c = canvas.height;
        ctx.clearRect(0, 0, w, h_c);

        const data = hiraganaData[currentIndex];

        // Draw cross guides
        ctx.strokeStyle = 'rgba(206, 147, 216, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(w/2, 8); ctx.lineTo(w/2, h_c-8);
        ctx.moveTo(8, h_c/2); ctx.lineTo(w-8, h_c/2);
        ctx.stroke();
        ctx.setLineDash([]);

        const pad = 10;
        const area = w - pad * 2;

        // Draw actual font character as guide
        ctx.save();
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#546e7a';
        ctx.font = 'bold ' + Math.floor(area * 0.85) + 'px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(data.char, w / 2, h_c / 2 + 2);
        ctx.restore();

        // Stroke order numbers
        data.paths.forEach((stroke, i) => {
            const pts = stroke.points;
            const sx = pad + pts[0][0] * area;
            const sy = pad + pts[0][1] * area;
            ctx.fillStyle = '#e91e63';
            ctx.beginPath();
            ctx.arc(sx, sy, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 9px Nunito, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('' + (i + 1), sx, sy);
        });
    }

    // =========================================================================
    // MAIN DRAWING CANVAS
    // =========================================================================
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    let canvasRect = null;

    function resizeCanvas() {
        const container = document.getElementById('canvasContainer');
        const rect = container.getBoundingClientRect();
        const size = Math.floor(rect.width);
        drawCanvas.width = size;
        drawCanvas.height = size;
        drawCanvas.style.width = size + 'px';
        drawCanvas.style.height = size + 'px';
        canvasRect = drawCanvas.getBoundingClientRect();
        redrawCanvas();
    }

    function redrawCanvas() {
        const w = drawCanvas.width;
        const h = drawCanvas.height;
        drawCtx.clearRect(0, 0, w, h);

        // Draw guide strokes
        drawGuideOnMain();

        // Redraw user strokes
        userStrokes.forEach(stroke => {
            drawStrokePath(stroke, '#37474f', 4);
        });

        // Draw current stroke
        if (currentStroke && currentStroke.length > 0) {
            drawStrokePath(currentStroke, '#37474f', 4);
        }

        updateStrokeCounter();
    }

    function drawGuideOnMain() {
        const w = drawCanvas.width;
        const h = drawCanvas.height;
        const data = hiraganaData[currentIndex];
        const pad = w * 0.08;
        const area = w - pad * 2;

        // Draw the ACTUAL font character as a tracing guide
        drawCtx.save();
        drawCtx.globalAlpha = 0.18;
        drawCtx.fillStyle = '#90a4ae';
        drawCtx.font = 'bold ' + Math.floor(area * 0.88) + 'px "Noto Sans JP", sans-serif';
        drawCtx.textAlign = 'center';
        drawCtx.textBaseline = 'middle';
        drawCtx.fillText(data.char, w / 2, h / 2 + area * 0.03);
        drawCtx.restore();

        // Draw stroke order numbers at approximate starting positions
        data.paths.forEach((stroke, i) => {
            const pts = stroke.points;
            const sx = pad + pts[0][0] * area;
            const sy = pad + pts[0][1] * area;
            const r = Math.max(12, w * 0.035);

            drawCtx.fillStyle = 'rgba(233, 30, 99, 0.7)';
            drawCtx.beginPath();
            drawCtx.arc(sx, sy, r, 0, Math.PI * 2);
            drawCtx.fill();
            drawCtx.fillStyle = 'white';
            drawCtx.font = 'bold ' + Math.max(10, w * 0.03) + 'px Nunito, sans-serif';
            drawCtx.textAlign = 'center';
            drawCtx.textBaseline = 'middle';
            drawCtx.fillText('' + (i + 1), sx, sy);
        });
    }

    function drawStrokePath(points, color, width) {
        if (points.length < 2) return;
        drawCtx.strokeStyle = color;
        drawCtx.lineWidth = width;
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.setLineDash([]);
        drawCtx.beginPath();
        drawCtx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            drawCtx.lineTo(points[i].x, points[i].y);
        }
        drawCtx.stroke();
    }

    function updateStrokeCounter() {
        const count = userStrokes.length + (currentStroke ? 1 : 0);
        const expected = hiraganaData[currentIndex].strokes;
        document.getElementById('strokeCounter').textContent = 'Strokes: ' + count + ' / ' + expected;
    }

    // =========================================================================
    // TOUCH / MOUSE INPUT
    // =========================================================================
    function getPos(e) {
        canvasRect = drawCanvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        // Scale to canvas internal coordinates
        const scaleX = drawCanvas.width / canvasRect.width;
        const scaleY = drawCanvas.height / canvasRect.height;
        return {
            x: (clientX - canvasRect.left) * scaleX,
            y: (clientY - canvasRect.top) * scaleY
        };
    }

    function startStroke(e) {
        if (showingAnimation) return;
        e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        currentStroke = [pos];
    }

    function moveStroke(e) {
        if (!isDrawing || !currentStroke || showingAnimation) return;
        e.preventDefault();
        const pos = getPos(e);
        currentStroke.push(pos);
        redrawCanvas();
    }

    function endStroke(e) {
        if (!isDrawing || !currentStroke || showingAnimation) return;
        e.preventDefault();
        isDrawing = false;
        if (currentStroke.length > 2) {
            userStrokes.push(currentStroke);
        }
        currentStroke = null;
        redrawCanvas();
    }

    // Touch events
    drawCanvas.addEventListener('touchstart', startStroke, { passive: false });
    drawCanvas.addEventListener('touchmove', moveStroke, { passive: false });
    drawCanvas.addEventListener('touchend', endStroke, { passive: false });
    drawCanvas.addEventListener('touchcancel', endStroke, { passive: false });

    // Mouse events
    drawCanvas.addEventListener('mousedown', startStroke);
    drawCanvas.addEventListener('mousemove', moveStroke);
    drawCanvas.addEventListener('mouseup', endStroke);
    drawCanvas.addEventListener('mouseleave', endStroke);

    // Prevent scrolling while drawing on canvas
    document.getElementById('canvasContainer').addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

    // =========================================================================
    // ACTIONS
    // =========================================================================
    function clearCanvas() {
        userStrokes = [];
        currentStroke = null;
        isDrawing = false;
        showingAnimation = false;
        guidePixelCache = { char: null, mask: null, w: 0 };
        redrawCanvas();
        hideFeedback();
    }

    function nextChar() {
        currentIndex = (currentIndex + 1) % hiraganaData.length;
        clearCanvas();
        updateUI();
    }

    function prevChar() {
        currentIndex = (currentIndex - 1 + hiraganaData.length) % hiraganaData.length;
        clearCanvas();
        updateUI();
    }

    // =========================================================================
    // STROKE ANALYSIS & FEEDBACK
    // =========================================================================
    function analyzeStrokeDirection(points) {
        if (points.length < 2) return 'dot';
        const first = points[0];
        const last = points[points.length - 1];
        const dx = last.x - first.x;
        const dy = last.y - first.y;
        const angle = Math.atan2(dy, dx) * 180 / Math.PI;

        // Determine primary direction
        if (Math.abs(dx) < 15 && Math.abs(dy) < 15) return 'dot';

        if (angle >= -45 && angle < 45) return 'right';
        if (angle >= 45 && angle < 135) return 'down';
        if (angle >= 135 || angle < -135) return 'left';
        if (angle >= -135 && angle < -45) return 'up';
        return 'unknown';
    }

    function getExpectedDirection(dir) {
        // Map our path directions to expected primary directions
        const map = {
            'right': ['right', 'down'],
            'left': ['left'],
            'down': ['down', 'down-left', 'down-right'],
            'down-left': ['down', 'down-left', 'left'],
            'down-right': ['down', 'down-right', 'right'],
            'up': ['up'],
            'curve-right': ['right', 'down', 'down-right'],
            'curve-left': ['right', 'down', 'left', 'down-left'],
            'hook-right': ['down', 'right'],
            'hook-left': ['down', 'left'],
            'loop': ['right', 'down', 'left', 'down-left', 'down-right'],
            'up-curve': ['up', 'right']
        };
        return map[dir] || ['right', 'down', 'left', 'up'];
    }

    // Render the character onto a hidden canvas and get its pixel mask
    let guidePixelCache = { char: null, mask: null, w: 0 };

    function getGuidePixelMask(canvasW) {
        const data = hiraganaData[currentIndex];
        if (guidePixelCache.char === data.char && guidePixelCache.w === canvasW) {
            return guidePixelCache.mask;
        }

        const offscreen = document.createElement('canvas');
        offscreen.width = canvasW;
        offscreen.height = canvasW;
        const ctx = offscreen.getContext('2d');
        const pad = canvasW * 0.08;
        const area = canvasW - pad * 2;

        ctx.fillStyle = '#000000';
        ctx.font = 'bold ' + Math.floor(area * 0.88) + 'px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(data.char, canvasW / 2, canvasW / 2 + area * 0.03);

        const imageData = ctx.getImageData(0, 0, canvasW, canvasW);
        const mask = imageData.data; // RGBA array
        guidePixelCache = { char: data.char, mask, w: canvasW };
        return mask;
    }

    // Check if a pixel coordinate is on or near the font-rendered character
    function isNearCharacter(x, y, mask, w, tolerance) {
        // Check a square area around (x,y) within tolerance
        const ix = Math.round(x);
        const iy = Math.round(y);
        for (let dy = -tolerance; dy <= tolerance; dy++) {
            for (let dx = -tolerance; dx <= tolerance; dx++) {
                const px = ix + dx;
                const py = iy + dy;
                if (px >= 0 && px < w && py >= 0 && py < w) {
                    const idx = (py * w + px) * 4;
                    if (mask[idx + 3] > 30) return true; // alpha > 30 means part of the character
                }
            }
        }
        return false;
    }

    // Score how well user strokes overlap with the actual font character pixels
    function fontProximityScore(canvasW) {
        const mask = getGuidePixelMask(canvasW);
        const tolerance = Math.max(8, Math.floor(canvasW * 0.04)); // ~4% tolerance
        let onChar = 0;
        let totalSampled = 0;

        userStrokes.forEach(stroke => {
            const step = Math.max(1, Math.floor(stroke.length / 25));
            for (let i = 0; i < stroke.length; i += step) {
                totalSampled++;
                if (isNearCharacter(stroke[i].x, stroke[i].y, mask, canvasW, tolerance)) {
                    onChar++;
                }
            }
        });

        if (totalSampled === 0) return 0;
        return onChar / totalSampled; // 1.0 = perfect, 0 = all off
    }

    function checkDrawing() {
        const data = hiraganaData[currentIndex];
        const expectedCount = data.strokes;
        const userCount = userStrokes.length;
        const w = drawCanvas.width;

        if (userCount === 0) {
            showFeedback('Draw the character first!', 'tryagain');
            playSfx('wrong');
            return;
        }

        // Check stroke count
        if (userCount !== expectedCount) {
            if (userCount < expectedCount) {
                showFeedback('Need ' + expectedCount + ' strokes - you drew ' + userCount + '!', 'wrong');
            } else {
                showFeedback('Too many strokes! ' + data.char + ' has ' + expectedCount + '.', 'wrong');
            }
            playSfx('wrong');
            return;
        }

        // Check how well user strokes match the actual font-rendered character
        const pixelScore = fontProximityScore(w);

        // Also check stroke directions
        let directionScore = 0;
        for (let i = 0; i < Math.min(userCount, data.paths.length); i++) {
            const userDir = analyzeStrokeDirection(userStrokes[i]);
            const expected = getExpectedDirection(data.paths[i].dir);
            if (expected.includes(userDir) || userDir === 'dot') {
                directionScore++;
            }
        }
        const dirPct = directionScore / expectedCount;

        // pixelScore: 1.0 = all points on character, 0 = none on character
        if (pixelScore >= 0.6 && dirPct >= 0.5) {
            showFeedback('Great job! (' + Math.round(pixelScore * 100) + '% accuracy)', 'great');
            playSfx('correct');
            practiced.add(data.char);
            savePracticed();
            buildCharGrid();
            updateProgress();
            spawnStars();
        } else if (pixelScore >= 0.4) {
            showFeedback('Almost! ' + Math.round(pixelScore * 100) + '% - trace closer to the guide!', 'tryagain');
            playSfx('wrong');
        } else if (dirPct < 0.5) {
            showFeedback('Check the stroke order! (' + Math.round(pixelScore * 100) + '%)', 'tryagain');
            playSfx('wrong');
        } else {
            showFeedback('Try to trace over the character! (' + Math.round(pixelScore * 100) + '%)', 'tryagain');
            playSfx('wrong');
        }
    }

    function showFeedback(msg, type) {
        const el = document.getElementById('feedbackMsg');
        el.textContent = msg;
        el.className = 'feedback-msg ' + type;
        // Force reflow to restart animation
        void el.offsetWidth;
        el.classList.add('show');
    }

    function hideFeedback() {
        const el = document.getElementById('feedbackMsg');
        el.classList.remove('show');
    }

    function savePracticed() {
        try {
            localStorage.setItem('fiona-writing-progress', JSON.stringify([...practiced]));
        } catch(e) {}
    }

    // =========================================================================
    // STAR PARTICLES (celebration)
    // =========================================================================
    function spawnStars() {
        const container = document.getElementById('canvasContainer');
        const rect = container.getBoundingClientRect();
        const symbols = ['\u2b50', '\u2728', '\ud83c\udf1f', '\ud83c\udf08'];

        for (let i = 0; i < 8; i++) {
            const star = document.createElement('div');
            star.className = 'star-particle';
            star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            star.style.left = (20 + Math.random() * 60) + '%';
            star.style.top = (20 + Math.random() * 60) + '%';
            star.style.animationDelay = (Math.random() * 0.3) + 's';
            container.appendChild(star);
            setTimeout(() => star.remove(), 1500);
        }
    }

    // =========================================================================
    // SHOW ME ANIMATION
    // =========================================================================
    // Interpolate smoothly along a set of control points using Catmull-Rom spline
    function catmullRomInterpolate(pts, totalSteps) {
        if (pts.length < 2) return pts.map(p => ({x: p[0], y: p[1]}));
        const result = [];
        // Pad with duplicate endpoints for Catmull-Rom
        const padded = [pts[0], ...pts, pts[pts.length - 1]];
        const segments = padded.length - 3;
        const stepsPerSeg = Math.max(4, Math.ceil(totalSteps / segments));

        for (let i = 0; i < segments; i++) {
            const p0 = padded[i], p1 = padded[i+1], p2 = padded[i+2], p3 = padded[i+3];
            for (let s = 0; s < stepsPerSeg; s++) {
                const t = s / stepsPerSeg;
                const t2 = t * t, t3 = t2 * t;
                const x = 0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
                const y = 0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
                result.push({x, y});
            }
        }
        // Add final point
        const last = pts[pts.length-1];
        result.push({x: last[0], y: last[1]});
        return result;
    }

    function showMe() {
        if (showingAnimation) return;
        showingAnimation = true;
        userStrokes = [];
        currentStroke = null;

        const data = hiraganaData[currentIndex];
        const w = drawCanvas.width;
        const pad = w * 0.08;
        const area = w - pad * 2;

        // Pre-render the character in pink on an offscreen canvas
        const charCanvas = document.createElement('canvas');
        charCanvas.width = w; charCanvas.height = w;
        const charCtx = charCanvas.getContext('2d');
        charCtx.fillStyle = '#e91e63';
        charCtx.font = 'bold ' + Math.floor(area * 0.88) + 'px "Noto Sans JP", sans-serif';
        charCtx.textAlign = 'center';
        charCtx.textBaseline = 'middle';
        charCtx.fillText(data.char, w / 2, w / 2 + area * 0.03);

        // Mask canvas - accumulates the "brush" that reveals the character
        const maskCanvas = document.createElement('canvas');
        maskCanvas.width = w; maskCanvas.height = w;
        const maskCtx = maskCanvas.getContext('2d');

        // Temp canvas for compositing
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w; tempCanvas.height = w;
        const tempCtx = tempCanvas.getContext('2d');

        const brushSize = Math.max(18, w * 0.06);

        // Clear and show guides
        redrawCanvas();

        let strokeIdx = 0;

        function renderFrame(tipPos) {
            drawCtx.clearRect(0, 0, w, w);
            drawGuideOnMain();

            // Composite: show character only where mask brush has been
            tempCtx.clearRect(0, 0, w, w);
            tempCtx.drawImage(maskCanvas, 0, 0);
            tempCtx.globalCompositeOperation = 'source-in';
            tempCtx.drawImage(charCanvas, 0, 0);
            tempCtx.globalCompositeOperation = 'source-over';

            // Draw the revealed character onto main canvas
            drawCtx.drawImage(tempCanvas, 0, 0);

            // Draw pen tip
            if (tipPos) {
                drawCtx.fillStyle = '#e91e63';
                drawCtx.beginPath();
                drawCtx.arc(tipPos.x, tipPos.y, 7, 0, Math.PI * 2);
                drawCtx.fill();
                drawCtx.fillStyle = 'white';
                drawCtx.beginPath();
                drawCtx.arc(tipPos.x, tipPos.y, 3, 0, Math.PI * 2);
                drawCtx.fill();
            }

            updateStrokeCounter();
        }

        function animateNextStroke() {
            if (strokeIdx >= data.paths.length) {
                // Final render without pen tip
                renderFrame(null);
                showingAnimation = false;
                return;
            }

            const stroke = data.paths[strokeIdx];
            const pts = stroke.points;
            const smoothPts = catmullRomInterpolate(pts, 50);
            const animPts = smoothPts.map(p => ({
                x: pad + p.x * area,
                y: pad + p.y * area
            }));

            let ptIdx = 0;

            function drawNext() {
                if (ptIdx >= animPts.length) {
                    strokeIdx++;
                    userStrokes.push([]); // track stroke count for counter
                    setTimeout(animateNextStroke, 350);
                    return;
                }

                const pt = animPts[ptIdx];

                // Paint on mask canvas to reveal more of the character
                maskCtx.fillStyle = 'white';
                maskCtx.beginPath();
                maskCtx.arc(pt.x, pt.y, brushSize, 0, Math.PI * 2);
                maskCtx.fill();

                // Connect to previous point for continuous reveal
                if (ptIdx > 0) {
                    const prev = animPts[ptIdx - 1];
                    maskCtx.strokeStyle = 'white';
                    maskCtx.lineWidth = brushSize * 2;
                    maskCtx.lineCap = 'round';
                    maskCtx.beginPath();
                    maskCtx.moveTo(prev.x, prev.y);
                    maskCtx.lineTo(pt.x, pt.y);
                    maskCtx.stroke();
                }

                ptIdx++;
                renderFrame(pt);
                requestAnimationFrame(drawNext);
            }

            drawNext();
        }

        animateNextStroke();
    }

    // =========================================================================
    // SOUND EFFECTS (Web Audio API, matching main site)
    // =========================================================================
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playSfx(type) {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;

        if (type === 'correct') {
            // Happy ascending chime
            [523, 659, 784].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.18, now + i * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
                osc.connect(gain).connect(ctx.destination);
                osc.start(now + i * 0.12);
                osc.stop(now + i * 0.12 + 0.4);
            });
        } else if (type === 'wrong') {
            // Low buzz
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.value = 180;
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }
    }

    // =========================================================================
    // KEYBOARD SHORTCUTS
    // =========================================================================
    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowRight') nextChar();
        else if (e.key === 'ArrowLeft') prevChar();
        else if (e.key === 'Escape' || e.key === 'Delete') clearCanvas();
        else if (e.key === 'Enter') checkDrawing();
    });

    // =========================================================================
    // INIT
    // =========================================================================
    let fontLoaded = false;

    function init() {
        buildCharGrid();
        resizeCanvas();
        updateUI();
    }

    // Wait for the Japanese font to load before drawing guides
    function waitForFont() {
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                fontLoaded = true;
                resizeCanvas();
                updateUI();
            });
        }
        // Also try loading it explicitly
        if (document.fonts && document.fonts.load) {
            document.fonts.load('bold 100px "Noto Sans JP"', 'あ').then(() => {
                fontLoaded = true;
                resizeCanvas();
                updateUI();
            }).catch(() => {});
        }
        // Fallback: retry after a delay
        setTimeout(() => {
            if (!fontLoaded) {
                fontLoaded = true;
                resizeCanvas();
                updateUI();
            }
        }, 2000);
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        updateUI();
    });

    // Ensure audio context is created on first user interaction (iOS requirement)
    document.addEventListener('touchstart', function initAudio() {
        getAudioCtx();
        document.removeEventListener('touchstart', initAudio);
    }, { once: true });

    document.addEventListener('click', function initAudio() {
        getAudioCtx();
        document.removeEventListener('click', initAudio);
    }, { once: true });

    init();
    waitForFont();
    </script>
