<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1240" viewBox="0 0 820 1240" role="img" aria-labelledby="title description">
    <title id="title">Question Words practice</title>
    <desc id="description">Five fill-in-the-blank exercises with English prompts and a Japanese word bank. No picture hints or printed answers.</desc>
    <rect width="820" height="1240" rx="24" fill="#fffcf6"/>
    <rect x="20" y="20" width="780" height="1200" rx="24" fill="none" stroke="#e2d2e9" stroke-width="4" stroke-dasharray="9 7"/>
    <g font-family="'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" fill="#40354c">
      <text x="410" y="89" text-anchor="middle" font-size="34" font-weight="bold">しつもんの れんしゅう</text>
      <text x="410" y="139" text-anchor="middle" font-size="32" fill="#785a8d">Question Words</text>
      <text x="410" y="188" text-anchor="middle" font-size="22">Use each question word once to complete the Japanese.</text>
      <rect x="52" y="217" width="716" height="66" rx="18" fill="#f1e9f6"/>
      <text x="410" y="258" text-anchor="middle" font-size="23">だれ　・　どこ　・　なに　・　なんじ　・　いくら</text>
      <g><rect x="52" y="310" width="716" height="138" rx="20" fill="#fff2f4"/>
      <circle cx="85" cy="348" r="19" fill="#785a8d"/><text x="85" y="355" text-anchor="middle" fill="white" font-size="21">1</text>
      <text x="120" y="358" font-size="27">あの ひとは __________ ですか。</text>
      <text x="120" y="401" font-size="23" fill="#5e5b6f">Who is that person?</text></g>
<g><rect x="52" y="468" width="716" height="138" rx="20" fill="#f1f7f4"/>
      <circle cx="85" cy="506" r="19" fill="#785a8d"/><text x="85" y="513" text-anchor="middle" fill="white" font-size="21">2</text>
      <text x="120" y="516" font-size="27">ねこは __________ ですか。</text>
      <text x="120" y="559" font-size="23" fill="#5e5b6f">Where is the cat?</text></g>
<g><rect x="52" y="626" width="716" height="138" rx="20" fill="#fff2f4"/>
      <circle cx="85" cy="664" r="19" fill="#785a8d"/><text x="85" y="671" text-anchor="middle" fill="white" font-size="21">3</text>
      <text x="120" y="674" font-size="27">これは __________ ですか。</text>
      <text x="120" y="717" font-size="23" fill="#5e5b6f">What is this?</text></g>
<g><rect x="52" y="784" width="716" height="138" rx="20" fill="#f1f7f4"/>
      <circle cx="85" cy="822" r="19" fill="#785a8d"/><text x="85" y="829" text-anchor="middle" fill="white" font-size="21">4</text>
      <text x="120" y="832" font-size="27">いま __________ ですか。</text>
      <text x="120" y="875" font-size="23" fill="#5e5b6f">What time is it now?</text></g>
<g><rect x="52" y="942" width="716" height="138" rx="20" fill="#fff2f4"/>
      <circle cx="85" cy="980" r="19" fill="#785a8d"/><text x="85" y="987" text-anchor="middle" fill="white" font-size="21">5</text>
      <text x="120" y="990" font-size="27">ケーキは __________ ですか。</text>
      <text x="120" y="1033" font-size="23" fill="#5e5b6f">How much is the cake?</text></g>
      <text x="60" y="1148" font-size="21">Name ____________________   Date ______________</text>
      <text x="410" y="1190" text-anchor="middle" font-size="18" fill="#785a8d">Read your completed sentences aloud.</text>
    </g>
  </svg>
